      <g fill="#3b82f6" opacity=".4"><rect x="67" y="166" width="52" height="3" rx="1.5"/><rect x="224" y="166" width="52" height="3" rx="1.5"/><rect x="381" y="166" width="52" height="3" rx="1.5"/></g>
