<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mxioc VPN 管理中心</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#162033;--muted:#718096;--line:#e1e7ef;--blue:#2167e8;--nav:#111a2b;--danger:#bd2d27;--green:#16824b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}.hidden{display:none!important}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#dce9ff,transparent 35%),linear-gradient(145deg,#f8fbff,#eef3fb)}.loginbox{width:min(420px,100%);padding:34px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px #18365e20}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:43px;height:43px;border-radius:12px;color:#fff;background:linear-gradient(145deg,#2878ff,#174bb8);font-size:20px;font-weight:800}.brand h1{font-size:20px;margin:0}.brand p{margin:4px 0 0;color:var(--muted)}label{display:block;font-weight:650;margin:16px 0 7px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:10px 11px;outline:none;color:var(--ink)}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2167e818}textarea{min-height:145px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.btn{border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:9px 13px;cursor:pointer;font-weight:650;color:var(--ink)}.btn:hover{border-color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--danger);border-color:#efc3bf}.btn.small{padding:6px 9px;font-size:12px}.full{width:100%;margin-top:20px}.error{min-height:20px;color:var(--danger);margin-top:11px}.app{display:flex;min-height:100vh}.side{position:sticky;top:0;height:100vh;width:245px;padding:20px 13px;background:var(--nav);color:#b9c7dc}.side .brand{padding:0 10px 24px}.side h1{font-size:17px;color:#fff}.nav{display:flex;align-items:center;gap:11px;padding:11px 13px;margin:3px 0;border-radius:8px;cursor:pointer}.nav:hover,.nav.active{color:#fff;background:#1d4f9a}.nav i{width:20px;text-align:center;font-style:normal}.main{min-width:0;flex:1;padding:27px 32px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.top h2{font-size:24px;margin:0}.top p{color:var(--muted);margin:5px 0 0}.actions,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:17px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:0 3px 8px #172a4408}.card{padding:16px}.card span{color:var(--muted)}.card b{display:block;margin-top:6px;font-size:25px}.panel{padding:18px;margin-bottom:16px}.toolbar input{max-width:320px}.toolbar select{max-width:190px}.tablewrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted);font-size:12px}code{padding:3px 6px;border-radius:5px;background:#f0f3f7}.pill{padding:4px 8px;border-radius:13px;background:#e8effc;color:#245aa5;font-size:12px}.pill.direct{background:#e6f6ec;color:var(--green)}.pill.reject{background:#fdeceb;color:var(--danger)}.muted{color:var(--muted)}.empty{text-align:center;padding:42px;color:var(--muted)}.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:#0d172b66}.modalbox{width:min(760px,100%);max-height:94vh;overflow:auto;padding:22px;background:#fff;border-radius:13px;box-shadow:0 30px 90px #0d172b55}.modalhead{display:flex;align-items:center;justify-content:space-between}.modalhead h3{margin:0;font-size:19px}.close{border:0;background:none;font-size:26px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.span2{grid-column:1/-1}.note{margin-top:12px;padding:11px;border-radius:8px;background:#f2f6fc;color:var(--muted)}.raw{min-height:58vh}.toast{position:fixed;right:22px;bottom:22px;z-index:20;padding:12px 16px;border-radius:9px;background:#18243a;color:#fff;box-shadow:0 8px 30px #0003}.backup{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{width:62px;padding:18px 8px}.side .brand{padding:0 3px 24px}.side .brand div:last-child,.nav span{display:none}.main{padding:18px 12px}.top{flex-direction:column}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.span2{grid-column:auto}.actions{width:100%}.actions .btn{flex:1}}
.section{margin:18px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#fafcff}.section legend{padding:0 7px;font-weight:750;color:#33445e}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:260px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:8px}.choice{display:flex;align-items:center;gap:8px;margin:0;padding:8px;border-radius:6px;font-weight:500;background:#fff}.choice:hover{background:#eef4ff}.choice input,.inlinecheck input{width:auto;margin:0}.inlinecheck{display:flex;align-items:center;gap:8px;margin-top:15px}.hint{font-size:12px;color:var(--muted);margin-top:5px}.protocol-title{margin:18px 0 0;font-size:15px;color:#2a4365}@media(max-width:700px){.checks{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login"><form id="loginForm" class="loginbox"><div class="brand"><div class="logo">M</div><div><h1>Mxioc VPN 管理中心</h1><p>订阅配置与分流策略管理</p></div></div><label>管理员账号</label><input id="user" autocomplete="username" required><label>密码</label><input id="pass" type="password" autocomplete="current-password" required><button class="btn primary full">登录</button><div id="loginError" class="error"></div></form></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand"><div class="logo">M</div><div><h1>Mxioc VPN</h1><p>Control Center</p></div></div><div class="nav active" data-page="overview"><i>⌂</i><span>总览</span></div><div class="nav" data-page="nodes"><i>◆</i><span>节点管理</span></div><div class="nav" data-page="chains"><i>⇄</i><span>链式代理</span></div><div class="nav" data-page="groups"><i>◫</i><span>策略组管理</span></div><div class="nav" data-page="rules"><i>≡</i><span>路由规则</span></div><div class="nav" data-page="dns"><i>◎</i><span>DNS 分流</span></div><div class="nav" data-page="subscriptions"><i>↗</i><span>订阅工具</span></div><div class="nav" data-page="raw"><i>{ }</i><span>原始配置</span></div><div class="nav" data-page="system"><i>⚙</i><span>系统与备份</span></div></aside><main class="main"><div class="top"><div><h2 id="title">总览</h2><p id="subtitle">综合订阅配置状态</p></div><div class="actions"><select id="profileSelect" title="选择当前编辑的订阅配置"></select><button id="manageProfiles" class="btn">订阅管理</button><button id="refresh" class="btn">刷新</button><button id="importNode" class="btn hidden">🔗 链接导入</button><button id="add" class="btn primary hidden">＋ 新增</button><button id="logout" class="btn">退出</button></div></div><div id="content"></div></main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle"></h3><button id="modalClose" class="close">×</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={token:sessionStorage.getItem('mxioc_token'),page:'overview',data:null,profiles:[],profile:localStorage.getItem('mxioc_profile')||'clash'};
function notice(text){$('toast').textContent=text;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}
function logout(){sessionStorage.removeItem('mxioc_token');S.token=null;$('app').classList.add('hidden');$('login').classList.remove('hidden')}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+S.token,'X-Profile':S.profile};let r=await fetch('/admin/api'+path,opt),d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error(d.error||'登录已失效')}if(!r.ok)throw Error(d.error||'请求失败');return d}
const jsonOpt=(method,body)=>({method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
async function loadProfiles(){let d=await api('/profiles');S.profiles=d.profiles;if(!S.profiles.some(x=>x.id===S.profile))S.profile=S.profiles[0]?.id||'clash';localStorage.setItem('mxioc_profile',S.profile);$('profileSelect').innerHTML=S.profiles.map(x=>`<option value="${esc(x.id)}" ${x.id===S.profile?'selected':''}>${esc(x.name)} · ${esc(x.id)}</option>`).join('')}
async function reload(render=true){S.data=await api('/snapshot');if(render)draw()}
const pageInfo={overview:['总览','综合订阅配置状态'],nodes:['节点管理','节点的新增、修改、删除与策略组同步'],chains:['链式代理','选择入口和出口节点组成两跳代理'],groups:['策略组管理','管理业务分组、节点列表和选择顺序'],rules:['路由规则','管理直连、代理、拒绝及业务分组规则'],dns:['DNS 分流','按域名指定国内或国外 DNS'],subscriptions:['订阅工具','批量导入订阅并生成其他客户端的转换链接'],raw:['原始配置','直接编辑完整 Clash / Mihomo YAML'],system:['系统与备份','修改密码、查看和恢复历史备份']};
async function go(page){S.page=page;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));$('title').textContent=pageInfo[page][0];$('subtitle').textContent=pageInfo[page][1];$('add').classList.toggle('hidden',!['nodes','chains','groups','rules','dns'].includes(page));$('importNode').classList.toggle('hidden',page!=='nodes');if(!S.profiles.length)await loadProfiles();if(!S.data)await reload(false);draw()}
function draw(){({overview,nodes,chains,groups,rules,dns,subscriptions,raw,system}[S.page]||overview)()}
function cards(){return `<div class="cards"><div class="card"><span>节点</span><b>${S.data.nodes.length}</b></div><div class="card"><span>策略组</span><b>${S.data.groups.length}</b></div><div class="card"><span>路由规则</span><b>${S.data.rules.length}</b></div><div class="card"><span>DNS 分流</span><b>${S.data.dnsPolicies.length}</b></div></div>`}
function overview(){let p=S.profiles.find(x=>x.id===S.profile)||S.data.profile,url=location.origin+p.url;$('content').innerHTML=cards()+`<section class="panel"><h3>${esc(p.name)}</h3><p>最后修改：${esc(S.data.updated)}</p><label>当前订阅链接</label><div class="toolbar"><input value="${esc(url)}" readonly><button class="btn" onclick="copyText('${esc(url)}')">复制链接</button><a class="btn primary" href="${esc(p.url)}">下载配置</a></div><p class="muted">当前页面中的节点、策略组、路由和 DNS 修改只作用于这个订阅配置。每次保存都会校验并自动备份。</p><button class="btn" onclick="go('raw')">查看完整配置</button></section>`}
function nodes(){let q=($('search')?.value||'').toLowerCase(),rows=S.data.nodes.filter(x=>(x.name+' '+x.type+' '+x.server).toLowerCase().includes(q));$('content').innerHTML=cards()+`<section class="panel"><div class="toolbar"><input id="search" placeholder="搜索名称、协议、服务器" value="${esc(q)}"></div><div class="tablewrap"><table><thead><tr><th>节点名称</th><th>协议</th><th>服务器</th><th>端口</th><th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td><code>${esc(x.type)}</code></td><td>${esc(x.server)}</td><td>${esc(x.port)}</td><td><button class="btn small" onclick="nodeModal(${x.index})">编辑</button> <button class="btn small danger" onclick="deleteNode(${x.index})">删除</button></td></tr>`).join('')}</tbody></table></div></section>`;$('search').oninput=nodes}
function chains(){let rows=S.data.nodes.filter(x=>x.config?.['dialer-proxy']);$('content').innerHTML=`<div class="cards"><div class="card"><span>链式代理</span><b>${rows.length}</b></div><div class="card"><span>普通节点</span><b>${S.data.nodes.length-rows.length}</b></div><div class="card"><span>策略组</span><b>${S.data.groups.length}</b></div><div class="card"><span>工作方式</span><b style="font-size:16px">入口 → 出口</b></div></div><section class="panel"><div class="note">链式代理会先连接入口中转节点，再通过它连接出口落地节点。Clash/Mihomo 配置会完整保留链路；转换成普通分享链接时无法表达两跳关系，因此转换页面会跳过这些链式节点。</div><div class="tablewrap"><table><thead><tr><th>链式节点名称</th><th>入口节点</th><th>出口协议</th><th>出口服务器</th><th>已加入分组</th><th>操作</th></tr></thead><tbody>${rows.map(x=>{let gs=S.data.groups.filter(g=>(g.config.proxies||[]).includes(x.name)).length;return `<tr><td>${esc(x.name)}</td><td>${esc(x.config['dialer-proxy'])}</td><td><code>${esc(x.type)}</code></td><td>${esc(x.server)}:${esc(x.port)}</td><td>${gs}</td><td><button class="btn small" onclick="chainModal(${x.index})">编辑</button> <button class="btn small danger" onclick="deleteNode(${x.index})">删除</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">还没有链式代理，点击右上角“新增”创建</td></tr>'}</tbody></table></div></section>`}
function ordinaryNodes(){return S.data.nodes.filter(x=>!x.config?.['dialer-proxy'])}
function inferChainExit(chain){if(!chain)return ordinaryNodes()[0]?.name||'';let keys=['type','server','port','uuid','password','cipher'];let found=ordinaryNodes().find(n=>keys.every(k=>String(n.config?.[k]??'')===String(chain.config?.[k]??'')));return found?.name||ordinaryNodes()[0]?.name||''}
function groupChecks(selected,klass='chainGroup'){let set=new Set(selected||[]);return `<div class="toolbar"><button type="button" class="btn small" onclick="document.querySelectorAll('.${klass}').forEach(x=>x.checked=true)">全选</button><button type="button" class="btn small" onclick="document.querySelectorAll('.${klass}').forEach(x=>x.checked=false)">清空</button></div><div class="checks">${S.data.groups.filter(g=>!g.name.includes('广告拦截')).map(g=>`<label class="choice"><input class="${klass}" type="checkbox" value="${esc(g.name)}" ${set.has(g.name)?'checked':''}><span>${esc(g.name)} <small class="muted">${esc(optionLabel(g.type))}</small></span></label>`).join('')}</div>`}
function chainModal(index){let x=index==null?null:S.data.nodes.find(n=>n.index===index),normal=ordinaryNodes();if(normal.length<2)return alert('至少需要两个普通节点才能创建链式代理');let selected=x?S.data.groups.filter(g=>(g.config.proxies||[]).includes(x.name)).map(g=>g.name):S.data.groups.filter(g=>!g.name.includes('广告拦截')).map(g=>g.name);openModal(x?'编辑链式代理':'新增链式代理',`<form id="editForm"><fieldset class="section"><legend>链路设置</legend><div class="grid"><div class="span2"><label>链式代理名称</label><input id="chainName" required value="${esc(x?.name||'')}" placeholder="例如 美国 CN2 → 落地 VLESS 🇺🇸"></div><div><label>入口节点（中转）</label><select id="chainEntry">${options(normal.map(n=>n.name),x?.config?.['dialer-proxy']||normal[0].name)}</select><div class="hint">客户端首先连接的中转节点。</div></div><div><label>出口节点（落地）</label><select id="chainExit">${options(normal.map(n=>n.name),inferChainExit(x))}</select><div class="hint">最终访问互联网时显示的出口 IP。</div></div></div></fieldset><fieldset class="section"><legend>加入策略组</legend><p class="hint">默认勾选全部策略组，可单选、多选或清空；广告拦截组不会加入节点。</p>${groupChecks(selected)}</fieldset><div id="formError" class="error"></div><button class="btn primary">保存链式代理</button></form>`);$('editForm').onsubmit=async e=>{e.preventDefault();try{let body={name:val('chainName'),entry:val('chainEntry'),exit:val('chainExit'),oldName:x?.name,groups:[...document.querySelectorAll('.chainGroup:checked')].map(z=>z.value)};await api('/chains',jsonOpt(x?'PUT':'POST',body));closeModal();await reload();notice('链式代理已保存')}catch(err){$('formError').textContent=err.message}}}
function groups(){let q=($('search')?.value||'').toLowerCase(),rows=S.data.groups.filter(x=>(x.name+' '+x.type).toLowerCase().includes(q));$('content').innerHTML=cards()+`<section class="panel"><div class="note">类型说明：手动选择适合业务分组；自动测速会选择延迟最低的节点；故障切换会在当前节点失效时切换；负载均衡会分散连接。</div><div class="toolbar"><input id="search" placeholder="搜索策略组" value="${esc(q)}"></div><div class="tablewrap"><table><thead><tr><th>策略组</th><th>类型</th><th>选项数量</th><th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td><code>${esc(optionLabel(x.type))}</code></td><td>${x.count}</td><td><button class="btn small" onclick="groupModal(${x.index})">编辑</button> <button class="btn small danger" onclick="deleteGroup(${x.index})">删除</button></td></tr>`).join('')}</tbody></table></div></section>`;$('search').oninput=groups}
function rules(){let q=($('search')?.value||'').toLowerCase(),action=$('filter')?.value||'',rows=S.data.rules.filter(x=>(!q||x.raw.toLowerCase().includes(q))&&(!action||x.action===action));let actions=['DIRECT','REJECT',...S.data.groups.map(x=>x.name)];$('content').innerHTML=`<div class="cards"><div class="card"><span>规则总数</span><b>${S.data.rules.length}</b></div><div class="card"><span>直连规则</span><b>${S.data.rules.filter(x=>x.action==='DIRECT').length}</b></div><div class="card"><span>统一代理规则</span><b>${S.data.rules.filter(x=>x.action==='✈️ Proxy').length}</b></div><div class="card"><span>业务分组</span><b>${new Set(S.data.rules.map(x=>x.action).filter(x=>!['DIRECT','REJECT','✈️ Proxy'].includes(x))).size}</b></div></div><section class="panel"><div class="note">动作说明：DIRECT 表示不经过代理；REJECT 表示拦截；Proxy 表示走统一代理；选择业务组则使用该组当前选中的节点。</div><div class="toolbar"><input id="search" placeholder="搜索完整规则" value="${esc(q)}"><select id="filter"><option value="">全部动作</option>${options(actions,action)}</select></div><div class="tablewrap"><table><thead><tr><th>#</th><th>匹配类型</th><th>匹配值</th><th>执行动作</th><th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.index+1}</td><td><code>${esc(optionLabel(x.type))}</code></td><td title="${esc(x.raw)}"><code>${esc(x.value||x.raw)}</code></td><td><span class="pill ${x.action==='DIRECT'?'direct':x.action.startsWith('REJECT')?'reject':''}">${esc(optionLabel(x.action))}</span></td><td><button class="btn small" onclick="moveRule(${x.index},-1)">↑</button> <button class="btn small" onclick="moveRule(${x.index},1)">↓</button> <button class="btn small" onclick="ruleModal(${x.index})">编辑</button> <button class="btn small danger" onclick="deleteRule(${x.index})">删除</button></td></tr>`).join('')}</tbody></table></div></section>`;$('search').oninput=rules;$('filter').onchange=rules}
function dns(){let q=($('search')?.value||'').toLowerCase(),rows=S.data.dnsPolicies.filter(x=>x.domain.toLowerCase().includes(q));$('content').innerHTML=`<section class="panel"><div class="toolbar"><input id="search" placeholder="搜索域名" value="${esc(q)}"></div><div class="tablewrap"><table><thead><tr><th>域名匹配</th><th>DNS 服务器</th><th>操作</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td><code>${esc(x.domain)}</code></td><td>${x.servers.map(esc).join('<br>')}</td><td><button class="btn small" onclick="dnsModal('${encodeURIComponent(x.domain)}')">编辑</button> <button class="btn small danger" onclick="deleteDns('${encodeURIComponent(x.domain)}')">删除</button></td></tr>`).join('')}</tbody></table></div></section>`;$('search').oninput=dns}
async function subscriptions(){let p=S.profiles.find(x=>x.id===S.profile)||S.data.profile,clashUrl=location.origin+p.url;$('content').innerHTML=`<section class="panel"><h3>导入订阅链接</h3><p class="muted">读取 Clash YAML 或 Base64 分享链接订阅，把其中支持的节点加入当前“${esc(p.name)}”配置。</p><form id="subImportForm"><label>来源订阅链接</label><input id="sourceSubUrl" type="url" required placeholder="https://example.com/subscription"><div class="grid"><div><label>名称重复时</label><select id="subConflict"><option value="rename">保留两者，自动给新节点编号（推荐）</option><option value="skip">跳过重名节点</option><option value="replace">用新节点覆盖同名节点</option></select></div><div><label>读取操作</label><button id="previewSub" type="button" class="btn" style="margin-top:0;width:100%">读取并预览订阅</button></div></div><fieldset class="section"><legend>导入后加入策略组</legend><p class="hint">默认全部勾选，可单选或多选。</p>${groupChecks(S.data.groups.filter(g=>!g.name.includes('广告拦截')).map(g=>g.name),'importGroup')}</fieldset><div id="subPreview" class="note">请先填写链接并点击“读取并预览订阅”。</div><div id="formError" class="error"></div><button id="confirmSubImport" class="btn primary" disabled>确认导入节点</button></form></section><section class="panel"><h3>订阅转换链接</h3><p class="muted">Clash 原始配置保留节点、策略组、路由、DNS 和链式代理。V2Ray/Shadowrocket 转换链接仅包含节点分享链接，不包含 Clash 的策略组、路由和 DNS。</p><div class="backup"><div><b>Clash / Mihomo 完整订阅</b><div class="muted">支持当前 YAML 中的全部功能和链式代理</div><code>${esc(clashUrl)}</code></div><div class="toolbar"><button class="btn small" onclick="copyText('${esc(clashUrl)}')">复制链接</button><a class="btn small primary" href="${esc(p.url)}">下载</a></div></div><div id="conversionRows"><div class="empty">正在检查客户端兼容性…</div></div></section>`;$('previewSub').onclick=previewSubscription;$('subImportForm').onsubmit=confirmSubscriptionImport;try{let d=await api('/conversions');$('conversionRows').innerHTML=d.formats.map(f=>{let url=location.origin+f.url,skipped=f.skipped||[];return `<div class="backup"><div style="min-width:0"><b>${esc(f.name)}</b><div class="muted">可转换 ${f.supported} 个节点；跳过 ${skipped.length} 个节点</div><div class="hint">${esc(f.note)}</div><code>${esc(url)}</code>${skipped.length?`<details><summary style="color:var(--danger);margin-top:8px">查看不兼容/被跳过节点</summary><div class="note">${skipped.map(x=>`${esc(x.name)}（${esc(x.type)}）：${esc(x.reason)}`).join('<br>')}</div></details>`:''}</div><div class="toolbar"><button class="btn small" onclick="copyText('${esc(url)}')">复制链接</button><a class="btn small primary" href="${esc(f.url)}">下载</a></div></div>`}).join('')}catch(e){$('conversionRows').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function previewSubscription(){let box=$('subPreview'),button=$('previewSub');$('formError').textContent='';if(!val('sourceSubUrl'))return $('formError').textContent='请填写来源订阅链接';button.disabled=true;box.textContent='正在读取订阅，请稍候…';try{let d=await api('/import-subscription/preview',jsonOpt('POST',{url:val('sourceSubUrl')})),protocols=Object.entries(d.protocols).map(([k,v])=>`${optionLabel(k)} ${v} 个`).join('、');box.innerHTML=`找到 <b>${d.total}</b> 个可导入节点：${esc(protocols)}。${d.skipped.length?`另有 ${d.skipped.length} 项无法识别，将跳过。`:''}`;$('confirmSubImport').disabled=false}catch(e){box.textContent='读取失败';$('formError').textContent=e.message;$('confirmSubImport').disabled=true}finally{button.disabled=false}}
async function confirmSubscriptionImport(e){e.preventDefault();if($('confirmSubImport').disabled)return;let button=$('confirmSubImport');button.disabled=true;$('formError').textContent='';try{let d=await api('/import-subscription',jsonOpt('POST',{url:val('sourceSubUrl'),conflict:val('subConflict'),groups:[...document.querySelectorAll('.importGroup:checked')].map(x=>x.value)}));await reload(false);notice(`已导入 ${d.added+d.replaced} 个节点`);await subscriptions()}catch(err){$('formError').textContent=err.message;button.disabled=false}}

async function system(){let d=await api('/backups');$('content').innerHTML=`<section class="panel"><h3>修改管理员密码</h3><form id="passwordForm" class="grid"><div><label>当前用户名</label><input id="pwUser" required></div><div><label>当前密码</label><input id="pwOld" type="password" required></div><div><label>新密码</label><input id="pwNew" type="password" minlength="10" required></div><div><label>确认新密码</label><input id="pwNew2" type="password" minlength="10" required></div><div class="span2"><button class="btn primary">保存密码</button></div></form></section><section class="panel"><h3>自动备份</h3><p class="muted">保留最近 100 份；恢复前也会自动备份当前配置。</p>${d.backups.length?d.backups.map(x=>`<div class="backup"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.time)} · ${(x.size/1024).toFixed(1)} KB</div></div><button class="btn small" onclick="restoreBackup('${encodeURIComponent(x.name)}')">恢复</button></div>`).join(''):'<div class="empty">暂无备份</div>'}</section>`;$('passwordForm').onsubmit=async e=>{e.preventDefault();if($('pwNew').value!==$('pwNew2').value)return alert('两次新密码不一致');try{await api('/password',jsonOpt('POST',{username:$('pwUser').value,current:$('pwOld').value,new:$('pwNew').value}));alert('密码已修改，请重新登录');logout()}catch(x){alert(x.message)}}}

const OPTION_LABELS={'':'不启用 / 使用默认值',vless:'VLESS（支持 Reality / TLS）',tuic:'TUIC（QUIC 高速协议）',hysteria2:'Hysteria2（抗丢包 QUIC）',trojan:'Trojan（TLS 伪装协议）',ss:'Shadowsocks（加密代理）',vmess:'VMess（V2Ray 协议）',tcp:'TCP（普通传输）',grpc:'gRPC（多路复用传输）',ws:'WebSocket（网页传输）','xtls-rprx-vision':'Vision（VLESS 高性能流控）',xudp:'XUDP（增强 UDP）',packetaddr:'PacketAddr（数据包地址编码）',chrome:'Chrome（谷歌浏览器指纹）',firefox:'Firefox（火狐浏览器指纹）',safari:'Safari（苹果浏览器指纹）',edge:'Edge（微软浏览器指纹）',random:'Random（随机浏览器指纹）',bbr:'BBR（推荐拥塞控制）',cubic:'CUBIC（通用拥塞控制）',new_reno:'New Reno（传统拥塞控制）',native:'Native（原生 UDP 中继）',quic:'QUIC（QUIC UDP 中继）',salamander:'Salamander（Hysteria2 混淆）',select:'select（手动选择）','url-test':'url-test（自动测速选最快）',fallback:'fallback（故障自动切换）','load-balance':'load-balance（负载均衡）','consistent-hashing':'consistent-hashing（一致性哈希）','round-robin':'round-robin（轮流使用）','sticky-sessions':'sticky-sessions（保持会话）',DIRECT:'DIRECT（中国大陆直连）',REJECT:'REJECT（拦截连接）','REJECT-DROP':'REJECT-DROP（静默丢弃）','✈️ Proxy':'✈️ Proxy（统一代理节点）','DOMAIN-SUFFIX':'DOMAIN-SUFFIX（域名后缀）',DOMAIN:'DOMAIN（完整域名）','DOMAIN-KEYWORD':'DOMAIN-KEYWORD（域名关键词）','IP-CIDR':'IP-CIDR（IPv4 网段）','IP-CIDR6':'IP-CIDR6（IPv6 网段）',GEOIP:'GEOIP（国家 IP 库）',GEOSITE:'GEOSITE（网站分类库）','PROCESS-NAME':'PROCESS-NAME（程序名称）','PROCESS-PATH':'PROCESS-PATH（程序路径）','DST-PORT':'DST-PORT（目标端口）','RULE-SET':'RULE-SET（规则集合）',MATCH:'MATCH（最终兜底规则）',auto:'auto（自动加密）',none:'none（不额外加密）',zero:'zero（零加密）','aes-128-gcm':'AES-128-GCM（兼容加密）','aes-256-gcm':'AES-256-GCM（兼容加密）','chacha20-ietf-poly1305':'ChaCha20-Poly1305（移动端友好）','2022-blake3-aes-128-gcm':'SS 2022 AES-128（新标准）','2022-blake3-aes-256-gcm':'SS 2022 AES-256（新标准）'};
function optionLabel(x){return OPTION_LABELS[x]||x}function options(items,current){return items.map(x=>`<option value="${esc(x)}" ${String(x)===String(current)?'selected':''}>${esc(optionLabel(x))}</option>`).join('')}
function val(id){return ($(id)?.value||'').trim()}function on(id){return !!$(id)?.checked}function numberOrText(x){let n=Number(x);return x!==''&&Number.isFinite(n)?n:x}
function protocolFields(type,cfg={}){let net=cfg.network||'tcp',ro=cfg['reality-opts']||{},go=cfg['grpc-opts']||{},wo=cfg['ws-opts']||{},host=wo.headers?.Host||wo.headers?.host||'';
 if(type==='vless')return `<h4 class="protocol-title">VLESS 认证与传输</h4><div class="grid"><div><label>UUID</label><input id="nUuid" required value="${esc(cfg.uuid||'')}"></div><div><label>传输方式</label><select id="nNetwork" onchange="renderTransport()">${options(['tcp','grpc','ws'],net)}</select></div><div><label>Flow 流控</label><select id="nFlow">${options(['','xtls-rprx-vision'],cfg.flow||'')}</select></div><div><label>数据包编码</label><select id="nPacket">${options(['','xudp','packetaddr'],cfg['packet-encoding']||'')}</select></div><div><label>TLS SNI / Server Name</label><input id="nSni" value="${esc(cfg.servername||'')}"></div><div><label>客户端指纹</label><select id="nFingerprint">${options(['chrome','firefox','safari','edge','random',''],cfg['client-fingerprint']||'chrome')}</select></div><div><label>Reality 公钥 PBK</label><input id="nPbk" value="${esc(ro['public-key']||'')}"></div><div><label>Reality Short ID</label><input id="nSid" value="${esc(ro['short-id']||'')}"></div><div class="span2 inlinecheck"><input id="nTls" type="checkbox" ${cfg.tls!==false?'checked':''}><span>启用 TLS / Reality</span></div><div class="span2 inlinecheck"><input id="nSkip" type="checkbox" ${cfg['skip-cert-verify']?'checked':''}><span>跳过证书验证</span></div></div><div id="transportFields"></div>`;
 if(type==='tuic')return `<h4 class="protocol-title">TUIC 认证与传输</h4><div class="grid"><div><label>UUID</label><input id="nUuid" required value="${esc(cfg.uuid||'')}"></div><div><label>密码</label><input id="nPassword" required value="${esc(cfg.password||'')}"></div><div><label>TLS SNI</label><input id="nSni" value="${esc(cfg.sni||'')}"></div><div><label>ALPN（逗号分隔）</label><input id="nAlpn" value="${esc((cfg.alpn||['h3']).join?.(',')||cfg.alpn||'h3')}"></div><div class="span2"><label>TLS 证书 SHA-256 指纹</label><input id="nCertFingerprint" value="${esc(cfg.fingerprint||'')}" placeholder="自签证书节点用于安全校验，可由链接自动生成"></div><div><label>拥塞控制</label><select id="nCongestion">${options(['bbr','cubic','new_reno'],cfg['congestion-controller']||'bbr')}</select></div><div><label>UDP 中继模式</label><select id="nUdpRelay">${options(['native','quic'],cfg['udp-relay-mode']||'native')}</select></div><div><label>心跳间隔（毫秒）</label><input id="nHeartbeat" type="number" value="${esc(cfg['heartbeat-interval']||10000)}"></div><div><label>请求超时（毫秒）</label><input id="nTimeout" type="number" value="${esc(cfg['request-timeout']||8000)}"></div><div class="inlinecheck"><input id="nReduceRtt" type="checkbox" ${cfg['reduce-rtt']?'checked':''}><span>减少 RTT</span></div><div class="inlinecheck"><input id="nSkip" type="checkbox" ${cfg['skip-cert-verify']?'checked':''}><span>跳过证书验证</span></div></div>`;
 if(type==='hysteria2')return `<h4 class="protocol-title">Hysteria2 认证与传输</h4><div class="grid"><div><label>认证密码</label><input id="nPassword" required value="${esc(cfg.password||cfg.auth||'')}"></div><div><label>TLS SNI</label><input id="nSni" value="${esc(cfg.sni||'')}"></div><div><label>ALPN（逗号分隔）</label><input id="nAlpn" value="${esc((cfg.alpn||['h3']).join?.(',')||cfg.alpn||'h3')}"></div><div><label>混淆类型</label><select id="nObfs">${options(['','salamander'],cfg.obfs||'')}</select></div><div><label>混淆密码</label><input id="nObfsPassword" value="${esc(cfg['obfs-password']||'')}"></div><div class="span2"><label>TLS 证书 SHA-256 指纹</label><input id="nCertFingerprint" value="${esc(cfg.fingerprint||'')}" placeholder="自签证书节点用于安全校验，可由链接自动生成"></div><div><label>上传带宽</label><input id="nUp" value="${esc(cfg.up||'') }" placeholder="例如 50 Mbps"></div><div><label>下载带宽</label><input id="nDown" value="${esc(cfg.down||'')}" placeholder="例如 200 Mbps"></div><div class="span2 inlinecheck"><input id="nSkip" type="checkbox" ${cfg['skip-cert-verify']?'checked':''}><span>跳过证书验证</span></div></div>`;
 if(type==='trojan')return `<h4 class="protocol-title">Trojan 认证与传输</h4><div class="grid"><div><label>密码</label><input id="nPassword" required value="${esc(cfg.password||'')}"></div><div><label>传输方式</label><select id="nNetwork" onchange="renderTransport()">${options(['tcp','grpc','ws'],net)}</select></div><div><label>TLS SNI</label><input id="nSni" value="${esc(cfg.sni||cfg.servername||'')}"></div><div><label>客户端指纹</label><select id="nFingerprint">${options(['chrome','firefox','safari','edge','random',''],cfg['client-fingerprint']||'chrome')}</select></div><div class="span2 inlinecheck"><input id="nSkip" type="checkbox" ${cfg['skip-cert-verify']?'checked':''}><span>跳过证书验证</span></div></div><div id="transportFields"></div>`;
 if(type==='ss')return `<h4 class="protocol-title">Shadowsocks 认证</h4><div class="grid"><div><label>加密方式</label><select id="nCipher">${options(['2022-blake3-aes-128-gcm','2022-blake3-aes-256-gcm','aes-128-gcm','aes-256-gcm','chacha20-ietf-poly1305'],cfg.cipher||'aes-256-gcm')}</select></div><div><label>密码</label><input id="nPassword" required value="${esc(cfg.password||'')}"></div></div>`;
 return `<h4 class="protocol-title">VMess 认证与传输</h4><div class="grid"><div><label>UUID</label><input id="nUuid" required value="${esc(cfg.uuid||'')}"></div><div><label>Alter ID</label><input id="nAlterId" type="number" value="${esc(cfg.alterId??cfg['alter-id']??0)}"></div><div><label>加密方式</label><select id="nCipher">${options(['auto','none','zero'],cfg.cipher||'auto')}</select></div><div><label>传输方式</label><select id="nNetwork" onchange="renderTransport()">${options(['tcp','grpc','ws'],net)}</select></div><div><label>TLS SNI</label><input id="nSni" value="${esc(cfg.servername||'')}"></div><div class="inlinecheck"><input id="nTls" type="checkbox" ${cfg.tls?'checked':''}><span>启用 TLS</span></div><div class="span2 inlinecheck"><input id="nSkip" type="checkbox" ${cfg['skip-cert-verify']?'checked':''}><span>跳过证书验证</span></div></div><div id="transportFields"></div>`}
function renderTransport(){let cfg=window.nodeDraft||{},net=val('nNetwork'),go=cfg['grpc-opts']||{},wo=cfg['ws-opts']||{},host=wo.headers?.Host||wo.headers?.host||'',box=$('transportFields');if(!box)return;box.innerHTML=net==='grpc'?`<div class="grid"><div class="span2"><label>gRPC Service Name</label><input id="nGrpcService" value="${esc(go['grpc-service-name']||'grpc')}"></div></div>`:net==='ws'?`<div class="grid"><div><label>WebSocket 路径</label><input id="nWsPath" value="${esc(wo.path||'/')}"></div><div><label>WebSocket Host</label><input id="nWsHost" value="${esc(host)}"></div></div>`:''}
function renderProtocol(){let type=val('nType'),box=$('protocolBox');if(box){box.innerHTML=protocolFields(type,window.nodeDraft||{});renderTransport()}}
function readNodeForm(){let type=val('nType'),port=numberOrText(val('nPort')),cfg={...(window.nodeDraft||{}),name:val('nName'),type,server:val('nServer'),port,udp:on('nUdp')};if(type==='vless'){cfg.uuid=val('nUuid');cfg.network=val('nNetwork');cfg.tls=on('nTls');cfg.encryption='none';if(val('nFlow'))cfg.flow=val('nFlow');else delete cfg.flow;if(val('nPacket'))cfg['packet-encoding']=val('nPacket');else delete cfg['packet-encoding'];if(val('nSni'))cfg.servername=val('nSni');else delete cfg.servername;if(val('nFingerprint'))cfg['client-fingerprint']=val('nFingerprint');if(val('nPbk'))cfg['reality-opts']={'public-key':val('nPbk'),'short-id':val('nSid')};else delete cfg['reality-opts'];if(on('nSkip'))cfg['skip-cert-verify']=true;else delete cfg['skip-cert-verify']}
 else if(type==='tuic'){Object.assign(cfg,{uuid:val('nUuid'),password:val('nPassword'),sni:val('nSni'),'congestion-controller':val('nCongestion'),'udp-relay-mode':val('nUdpRelay'),alpn:val('nAlpn').split(',').map(x=>x.trim()).filter(Boolean),'heartbeat-interval':Number(val('nHeartbeat')),'request-timeout':Number(val('nTimeout'))});if(val('nCertFingerprint'))cfg.fingerprint=val('nCertFingerprint');else delete cfg.fingerprint;if(on('nReduceRtt'))cfg['reduce-rtt']=true;else delete cfg['reduce-rtt'];if(on('nSkip'))cfg['skip-cert-verify']=true;else delete cfg['skip-cert-verify']}
 else if(type==='hysteria2'){cfg.password=val('nPassword');cfg.alpn=val('nAlpn').split(',').map(x=>x.trim()).filter(Boolean);if(val('nSni'))cfg.sni=val('nSni');else delete cfg.sni;if(val('nCertFingerprint'))cfg.fingerprint=val('nCertFingerprint');else delete cfg.fingerprint;if(val('nObfs'))cfg.obfs=val('nObfs');else delete cfg.obfs;if(val('nObfsPassword'))cfg['obfs-password']=val('nObfsPassword');else delete cfg['obfs-password'];if(val('nUp'))cfg.up=val('nUp');else delete cfg.up;if(val('nDown'))cfg.down=val('nDown');else delete cfg.down;if(on('nSkip'))cfg['skip-cert-verify']=true;else delete cfg['skip-cert-verify']}
 else if(type==='trojan'){cfg.password=val('nPassword');cfg.network=val('nNetwork');if(val('nSni'))cfg.sni=val('nSni');if(val('nFingerprint'))cfg['client-fingerprint']=val('nFingerprint');if(on('nSkip'))cfg['skip-cert-verify']=true}
 else if(type==='ss'){cfg.cipher=val('nCipher');cfg.password=val('nPassword')}
 else{cfg.uuid=val('nUuid');cfg.alterId=Number(val('nAlterId')||0);cfg.cipher=val('nCipher');cfg.network=val('nNetwork');cfg.tls=on('nTls');if(val('nSni'))cfg.servername=val('nSni');if(on('nSkip'))cfg['skip-cert-verify']=true}
 if(['vless','trojan','vmess'].includes(type)){let net=val('nNetwork');if(net==='grpc')cfg['grpc-opts']={'grpc-service-name':val('nGrpcService')};if(net==='ws'){cfg['ws-opts']={path:val('nWsPath')||'/'};if(val('nWsHost'))cfg['ws-opts'].headers={Host:val('nWsHost')}}}if(val('nDialer'))cfg['dialer-proxy']=val('nDialer');else delete cfg['dialer-proxy'];return cfg}
function nodeModal(index){let x=index==null?null:S.data.nodes.find(n=>n.index===index),cfg=x?.config||{name:'',type:'vless',server:'',port:443,udp:true,tls:true},dialers=['',...S.data.nodes.filter(n=>n.name!==x?.name).map(n=>n.name),...S.data.groups.filter(g=>g.name!==x?.name&&!g.name.includes('广告拦截')).map(g=>g.name)];window.nodeDraft=cfg;openModal(x?'编辑节点':'新增节点',`<form id="editForm"><fieldset class="section"><legend>基本信息</legend><div class="grid"><div><label>节点名称</label><input id="nName" required value="${esc(cfg.name||'')}" placeholder="例如 美国 Mxioc VLESS 🇺🇸"></div><div><label>协议</label><select id="nType" onchange="window.nodeDraft={};renderProtocol()">${options(['vless','tuic','hysteria2','trojan','ss','vmess'],cfg.type||'vless')}</select></div><div><label>服务器地址</label><input id="nServer" required value="${esc(cfg.server||'')}" placeholder="域名或 IP"></div><div><label>端口</label><input id="nPort" required value="${esc(cfg.port||443)}"></div><div class="span2"><label>前置中转节点（链式代理）</label><select id="nDialer">${options(dialers,cfg['dialer-proxy']||'')}</select><div class="hint">不启用表示直接连接该节点；选择后会先连接中转，再连接当前落地节点。</div></div><div class="span2 inlinecheck"><input id="nUdp" type="checkbox" ${cfg.udp!==false?'checked':''}><span>启用 UDP</span></div></div></fieldset><fieldset class="section"><legend>协议参数</legend><div id="protocolBox"></div></fieldset>${x?'':'<label class="inlinecheck"><input id="addAll" type="checkbox" checked><span>自动加入所有业务代理策略组（不含广告拦截组）</span></label>'}<div id="formError" class="error"></div><button class="btn primary">保存节点并生成配置</button></form>`);renderProtocol();$('editForm').onsubmit=async e=>{e.preventDefault();try{let config=readNodeForm();await api('/nodes',jsonOpt(x?'PUT':'POST',{config,oldName:x?.name,addToGroups:$('addAll')?.checked}));closeModal();await reload();notice('节点已保存并转换为 YAML')}catch(err){$('formError').textContent=err.message}}}
function renderGroupExtra(){let type=val('gType'),cfg=window.groupDraft||{},box=$('groupExtra');if(!box)return;box.innerHTML=type==='select'?'':`<div class="grid"><div><label>测速网址</label><input id="gUrl" value="${esc(cfg.url||'https://www.gstatic.com/generate_204')}"></div><div><label>检测间隔（秒）</label><input id="gInterval" type="number" value="${esc(cfg.interval||300)}"></div>${type==='url-test'?`<div><label>容差（毫秒）</label><input id="gTolerance" type="number" value="${esc(cfg.tolerance||50)}"></div>`:''}${type==='load-balance'?`<div><label>负载策略</label><select id="gStrategy">${options(['consistent-hashing','round-robin','sticky-sessions'],cfg.strategy||'consistent-hashing')}</select></div>`:''}<div class="inlinecheck"><input id="gLazy" type="checkbox" ${cfg.lazy!==false?'checked':''}><span>延迟检测</span></div></div>`}
function groupModal(index){let x=index==null?null:S.data.groups.find(n=>n.index===index),cfg=x?.config||{name:'',type:'select',proxies:['DIRECT','✈️ Proxy']};window.groupDraft=cfg;let selected=new Set(cfg.proxies||[]),available=['DIRECT','REJECT',...S.data.groups.filter(g=>g.name!==x?.name).map(g=>g.name),...S.data.nodes.map(n=>n.name)],ordered=[...(cfg.proxies||[]),...available.filter(a=>!selected.has(a))];openModal(x?'编辑策略组':'新增策略组',`<form id="editForm"><fieldset class="section"><legend>基本信息</legend><div class="grid"><div><label>策略组名称</label><input id="gName" required value="${esc(cfg.name||'')}" placeholder="例如 ☁️ 甲骨文 Oracle"></div><div><label>策略组类型</label><select id="gType" onchange="renderGroupExtra()">${options(['select','url-test','fallback','load-balance'],cfg.type||'select')}</select></div></div><div id="groupExtra"></div></fieldset><fieldset class="section"><legend>可选节点与策略</legend><p class="hint">勾选需要显示在该策略组中的项目；已选项目会优先保留原有顺序。</p><div class="checks">${ordered.map(a=>`<label class="choice"><input class="gChoice" type="checkbox" value="${esc(a)}" ${selected.has(a)?'checked':''}><span>${esc(a)}</span></label>`).join('')}</div></fieldset><div id="formError" class="error"></div><button class="btn primary">保存策略组并生成配置</button></form>`);renderGroupExtra();$('editForm').onsubmit=async e=>{e.preventDefault();try{let type=val('gType'),config={...cfg,name:val('gName'),type,proxies:[...document.querySelectorAll('.gChoice:checked')].map(z=>z.value)};if(type!=='select'){config.url=val('gUrl');config.interval=Number(val('gInterval'));config.lazy=on('gLazy');if(type==='url-test')config.tolerance=Number(val('gTolerance'));if(type==='load-balance')config.strategy=val('gStrategy')}await api('/groups',jsonOpt(x?'PUT':'POST',{config,oldName:x?.name}));closeModal();await reload();notice('策略组已保存并转换为 YAML')}catch(err){$('formError').textContent=err.message}}}
function ruleModal(index){let x=index==null?null:S.data.rules.find(n=>n.index===index),actions=['DIRECT','REJECT',...S.data.groups.map(g=>g.name)],types=['DOMAIN-SUFFIX','DOMAIN','DOMAIN-KEYWORD','IP-CIDR','IP-CIDR6','GEOIP','GEOSITE','PROCESS-NAME','PROCESS-PATH','DST-PORT','RULE-SET','MATCH'];openModal(x?'编辑路由规则':'新增路由规则',`<form id="editForm"><div class="grid"><div><label>匹配类型</label><select id="ruleType">${options(types,x?.type||'DOMAIN-SUFFIX')}</select><div class="hint">决定用完整域名、域名后缀、关键词、IP 或网站分类进行匹配。</div></div><div><label>执行动作 / 策略组</label><select id="ruleAction">${options(actions,x?.action||'DIRECT')}</select><div class="hint">直连不走节点；拦截会拒绝连接；策略组使用组内选中的节点。</div></div><div class="span2"><label>匹配值</label><input id="ruleValue" value="${esc(x?.value||'')}" placeholder="例如 example.com、CN 或 1.2.3.0/24"></div><div class="span2"><label>附加参数（通常留空）</label><input id="ruleOptions" value="${esc(x?.options||'')}" placeholder="例如 no-resolve（不额外解析域名）"></div><details class="span2"><summary>高级：使用原始规则</summary><label class="inlinecheck"><input id="rawMode" type="checkbox"><span>直接保存下面的原始规则</span></label><textarea id="ruleRaw" style="min-height:75px">${esc(x?.raw||'')}</textarea></details></div><div id="formError" class="error"></div><button class="btn primary">保存规则并生成配置</button></form>`);$('editForm').onsubmit=async e=>{e.preventDefault();try{let body={type:$('ruleType').value,value:$('ruleValue').value,action:$('ruleAction').value,options:$('ruleOptions').value,rawMode:$('rawMode').checked,raw:$('ruleRaw').value,oldRaw:x?.raw};await api('/rules',jsonOpt(x?'PUT':'POST',body));closeModal();await reload();notice('规则已保存')}catch(err){$('formError').textContent=err.message}}}
function setDnsPreset(){let p=val('dnsPreset');if(p==='cn')$('dnsServers').value='https://dns.alidns.com/dns-query\nhttps://doh.pub/dns-query';if(p==='foreign')$('dnsServers').value='https://1.1.1.1/dns-query#%E2%9C%88%EF%B8%8F%20Proxy\nhttps://dns.google/dns-query#%E2%9C%88%EF%B8%8F%20Proxy\nhttps://dns.quad9.net/dns-query#%E2%9C%88%EF%B8%8F%20Proxy'}
function dnsModal(encoded){let domain=encoded?decodeURIComponent(encoded):'',x=S.data.dnsPolicies.find(n=>n.domain===domain);openModal(x?'编辑 DNS 分流':'新增 DNS 分流',`<form id="editForm"><label>域名匹配</label><input id="dnsDomain" value="${esc(x?.domain||'')}" placeholder="+.example.com"><div class="hint">“+.example.com”表示该域名及其所有子域名。</div><label>快速选择 DNS 类型</label><select id="dnsPreset" onchange="setDnsPreset()"><option value="">保留当前 / 自定义</option><option value="cn">国内 DNS（阿里 DNS + 腾讯 DNS，适合中国网站）</option><option value="foreign">国外 DNS（通过 Proxy 查询，适合海外网站并防污染）</option></select><label>DNS 服务器（每行一个）</label><textarea id="dnsServers">${esc((x?.servers||['https://dns.alidns.com/dns-query','https://doh.pub/dns-query']).join('\n'))}</textarea><div id="formError" class="error"></div><button class="btn primary">保存 DNS 分流并生成配置</button></form>`);$('editForm').onsubmit=async e=>{e.preventDefault();try{await api('/dns',jsonOpt(x?'PUT':'POST',{domain:$('dnsDomain').value,servers:$('dnsServers').value,oldDomain:x?.domain}));closeModal();await reload();notice('DNS 分流已保存')}catch(err){$('formError').textContent=err.message}}}
function importNodeModal(){openModal('通过链接一键导入节点',`<form id="editForm"><label>节点分享链接</label><textarea id="nodeLink" required style="min-height:120px" placeholder="粘贴 vless://、tuic://、hysteria2://、hy2://、trojan://、ss:// 或 vmess:// 链接"></textarea><div class="note">系统会自动识别认证信息、TLS / Reality、SNI、ALPN、Hysteria2 带宽和链接内嵌证书；自签证书会安全转换为 SHA-256 指纹。</div><label class="inlinecheck"><input id="importAll" type="checkbox" checked><span>自动加入所有业务代理策略组（不含广告拦截组）</span></label><div id="formError" class="error"></div><button class="btn primary">一键导入并保存</button></form>`);$('editForm').onsubmit=async e=>{e.preventDefault();try{await api('/import-node',jsonOpt('POST',{link:val('nodeLink'),addToGroups:on('importAll')}));closeModal();await reload();notice('节点链接已导入并转换为 YAML')}catch(err){$('formError').textContent=err.message}}}
async function copyText(text){try{await navigator.clipboard.writeText(text);notice('订阅链接已复制')}catch{prompt('复制下面的订阅链接',text)}}
function profileManager(){let rows=S.profiles.map(p=>{let url=location.origin+p.url;return `<div class="backup"><div><b>${esc(p.name)}</b><div class="muted">链接标识：${esc(p.id)}</div><code>${esc(url)}</code></div><div class="toolbar"><button class="btn small" onclick="copyText('${esc(url)}')">复制链接</button><button class="btn small" onclick="profileEdit('${encodeURIComponent(p.id)}')">修改</button>${p.protected?'':`<button class="btn small danger" onclick="profileDelete('${encodeURIComponent(p.id)}')">删除</button>`}</div></div>`}).join('');openModal('订阅配置管理',`<form id="createProfile"><fieldset class="section"><legend>创建新的订阅配置</legend><div class="grid"><div><label>订阅显示名称</label><input id="profileName" required placeholder="例如 专用订阅"></div><div><label>链接标识</label><input id="profileId" required pattern="[a-z0-9][a-z0-9_-]{1,39}" placeholder="例如 zhuanyong"><div class="hint">只允许小写字母、数字、横线和下划线。</div></div><div class="span2"><label>创建方式</label><select id="profileTemplate"><option value="blank">创建空白配置（仅含可运行的基本骨架）</option>${S.profiles.map(p=>`<option value="${esc(p.id)}">复制“${esc(p.name)}”作为模板</option>`).join('')}</select></div></div><div id="formError" class="error"></div><button class="btn primary">创建订阅链接</button></fieldset></form><section class="section"><h4>已有订阅配置</h4>${rows}</section>`);$('createProfile').onsubmit=async e=>{e.preventDefault();try{let d=await api('/profiles',jsonOpt('POST',{name:val('profileName'),id:val('profileId'),templateId:val('profileTemplate')}));S.profile=d.profile.id;localStorage.setItem('mxioc_profile',S.profile);S.data=null;closeModal();await loadProfiles();await reload();notice('新订阅配置已创建')}catch(err){$('formError').textContent=err.message}}}
function profileEdit(encoded){let id=decodeURIComponent(encoded),p=S.profiles.find(x=>x.id===id);openModal('修改订阅配置',`<form id="editProfile"><label>订阅显示名称</label><input id="editProfileName" required value="${esc(p.name)}"><label>链接标识</label><input id="editProfileId" required value="${esc(p.id)}" ${p.protected?'disabled':''}><div class="hint">修改链接标识后，原来的订阅地址会失效；主订阅 clash 的地址固定不变。</div><div id="formError" class="error"></div><button class="btn primary">保存修改</button></form>`);$('editProfile').onsubmit=async e=>{e.preventDefault();try{let d=await api('/profiles',jsonOpt('PUT',{oldId:p.id,id:p.protected?p.id:val('editProfileId'),name:val('editProfileName')}));if(S.profile===p.id)S.profile=d.profile.id;localStorage.setItem('mxioc_profile',S.profile);S.data=null;closeModal();await loadProfiles();await reload();notice('订阅配置已修改')}catch(err){$('formError').textContent=err.message}}}
async function profileDelete(encoded){let id=decodeURIComponent(encoded),p=S.profiles.find(x=>x.id===id);if(!confirm(`确认删除订阅“${p.name}”？该配置文件将被删除，但已有自动备份保留。`))return;try{await api('/profiles',jsonOpt('DELETE',{id}));if(S.profile===id)S.profile='clash';localStorage.setItem('mxioc_profile',S.profile);S.data=null;closeModal();await loadProfiles();await reload();notice('订阅配置已删除')}catch(err){alert(err.message)}}
async function deleteNode(i){let x=S.data.nodes.find(n=>n.index===i);if(confirm('删除节点“'+x.name+'”并移除所有策略组引用？')){try{await api('/nodes',jsonOpt('DELETE',{name:x.name}));await reload();notice('节点已删除')}catch(e){alert(e.message)}}}
async function deleteGroup(i){let x=S.data.groups.find(n=>n.index===i);if(confirm('删除策略组“'+x.name+'”及所有指向它的规则？')){try{await api('/groups',jsonOpt('DELETE',{name:x.name}));await reload();notice('策略组已删除')}catch(e){alert(e.message)}}}
async function deleteRule(i){let x=S.data.rules.find(n=>n.index===i);if(confirm('删除规则“'+x.raw+'”？')){try{await api('/rules',jsonOpt('DELETE',{oldRaw:x.raw}));await reload();notice('规则已删除')}catch(e){alert(e.message)}}}
async function deleteDns(e){let domain=decodeURIComponent(e);if(confirm('删除 DNS 分流“'+domain+'”？')){try{await api('/dns',jsonOpt('DELETE',{oldDomain:domain}));await reload();notice('DNS 分流已删除')}catch(x){alert(x.message)}}}
async function moveRule(i,d){let x=S.data.rules.find(n=>n.index===i);try{await api('/rules/move',jsonOpt('POST',{raw:x.raw,direction:d}));await reload()}catch(e){alert(e.message)}}
async function restoreBackup(e){let name=decodeURIComponent(e);if(confirm('确认恢复备份 '+name+'？')){try{await api('/backups/restore',jsonOpt('POST',{name}));await reload();notice('备份已恢复')}catch(x){alert(x.message)}}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{let r=await fetch('/admin/api/login',jsonOpt('POST',{username:$('user').value,password:$('pass').value})),d=await r.json();if(!r.ok)throw Error(d.error);S.token=d.token;sessionStorage.setItem('mxioc_token',d.token);$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadProfiles();await go('overview')}catch(x){$('loginError').textContent=x.message}};
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.page));$('modalClose').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('logout').onclick=logout;$('manageProfiles').onclick=profileManager;$('profileSelect').onchange=async()=>{S.profile=$('profileSelect').value;localStorage.setItem('mxioc_profile',S.profile);S.data=null;await reload();notice('已切换订阅配置')};$('refresh').onclick=async()=>{try{await reload();notice('已刷新')}catch(e){alert(e.message)}};$('importNode').onclick=importNodeModal;$('add').onclick=()=>({nodes:nodeModal,chains:chainModal,groups:groupModal,rules:ruleModal,dns:dnsModal}[S.page])();
if(S.token){$('login').classList.add('hidden');$('app').classList.remove('hidden');go('overview').catch(logout)}
</script></body></html>
