  const query = (S.filters.monitoring || '').toLowerCase();
  const page = tableSlice(S.servers.filter(s => `${s.name} ${s.host} ${s.installType || ''}`.toLowerCase().includes(query)), 'monitoring');
  $('content').innerHTML = `<section class="panel"><div class="panel-head"><div><h3>服务器资源概览</h3><p class="muted">${S.servers.length} 台服务器 · 点击卡片查看详情 · 仅采集当前页，最多 3 个并发</p></div><button class="btn" id="monitorOverviewRefresh">${uiIcon('refresh-cw')}刷新当前页</button></div><input id="search" type="search" aria-label="搜索监控服务器" placeholder="搜索名称、IP 或内核…" value="${esc(S.filters.monitoring || '')}"></section><div class="host-overview-grid">${page.rows.map(s=>`<button type="button" class="host-card" data-host="${esc(s.id)}" aria-label="查看 ${esc(s.name)} 的监控详情"><span class="host-card-heading">${uiIcon('server')}<strong>${esc(s.name)}</strong>${uiIcon('chevron-right')}</span><span class="host-address">${esc(s.host)} · ${esc(s.installType || '3x-ui')}</span><span class="host-summary" data-summary>等待采样</span></button>`).join('') || '<p class="empty">没有匹配的服务器</p>'}</div>${pagination(page)}`;
  const cards = new Map([...document.querySelectorAll('[data-host]')].map(el=>[el.dataset.host, el]));
  cards.forEach((el,id)=>{ el.onclick=()=>openHostMonitor(encodeURIComponent(id)); renderMonitorCard(el,S.monitorCards.get(id)); });
  bindSearch('monitoring', renderMonitorOverview);
  const valid = () => generation === S.monitorGeneration && S.page === 'monitoring' && !S.monitorId && !document.hidden;
  let busy = false;
  const refresh = async () => {
    if (!valid() || busy) return;
    busy = true; clearTimeout(S.monitorTimer);
    const button = $('monitorOverviewRefresh'); button.disabled=true;
    const queue = [...page.rows];
    const controller = new AbortController(); S.monitorAbort=controller;
    await Promise.all(Array.from({length:Math.min(3,queue.length)},async()=>{
      while(queue.length && valid()) {
        const s=queue.shift();
        try {
          const data=await api('/servers/metrics?id='+encodeURIComponent(s.id),{signal:controller.signal});
          if (!valid()) break;
          S.monitorCards.set(s.id,data); renderMonitorCard(cards.get(s.id),data);
        } catch(error) {
          if (!valid() || error.name==='AbortError') break;
          const stale={...S.monitorCards.get(s.id),stale:true,error:error.message};
          S.monitorCards.set(s.id,stale);renderMonitorCard(cards.get(s.id),stale);
        }
      }
    }));
    busy=false; if(S.monitorAbort===controller) S.monitorAbort=null;
    if(button.isConnected) button.disabled=false;
    if(valid()) S.monitorTimer=setTimeout(refresh,30000);
    while(S.monitorCards.size>500) S.monitorCards.delete(S.monitorCards.keys().next().value);
  };
  $('monitorOverviewRefresh').onclick=refresh;
  void refresh();
}

function renderMonitorCard(card,data) {
  if(!card || !data) return;
  const pct=x=>x==null?'等待采样':Number(x).toFixed(1)+'%';
  const disk=data.disks?.find(d=>d.mount==='/') || data.disks?.[0];
  card.querySelector('[data-summary]').innerHTML=`<span class="host-state ${data.stale?'reject':''}">${data.stale?'采样失败 / 历史数据':data.warmingUp?'已连接 · 预热中':'采样成功'}</span><span class="host-mini-metrics"><span>${uiIcon('cpu')}CPU<strong>${pct(data.cpuPercent)}</strong></span><span>${uiIcon('memory-stick')}内存<strong>${pct(data.memory?.percent)}</strong></span><span>${uiIcon('hard-drive')}磁盘<strong>${pct(disk?.percent)}</strong></span></span><span class="host-address">${data.error?esc(data.error):data.sampledAt?'采样于 '+esc(new Date(data.sampledAt*1000).toLocaleTimeString())+' · 点击查看详情':'等待下一次采样'}</span>`;
}

async function refreshHostMetrics(generation = S.monitorGeneration) {
  if (S.page !== 'monitoring' || !S.monitorId || generation !== S.monitorGeneration || document.hidden || S.monitorAbort) return;
  clearTimeout(S.monitorTimer);
  const controller = new AbortController();
  S.monitorAbort = controller;
  const button = $('monitorRefresh');
  if (button) button.disabled = true;
  try {
    const data = await api('/servers/metrics?id=' + encodeURIComponent(S.monitorId), {signal: controller.signal});
    if (generation !== S.monitorGeneration || S.page !== 'monitoring') return;
    S.monitorData = data;
    $('monitorStatus').textContent = data.stale ? '采样中断 · 显示历史数据' : data.warmingUp ? '已连接 · 等待第二次采样' : '实时采样';
    $('monitorStatus').classList.toggle('reject', !!data.stale);
    $('monitorTimestamp').textContent = '采样时间 ' + new Date(data.sampledAt * 1000).toLocaleTimeString();
    $('monitorError').textContent = data.error || '';
    renderHostMetrics(data);
  } catch (error) {
    if (error.name !== 'AbortError' && generation === S.monitorGeneration && $('monitorError')) {
      $('monitorStatus').textContent = '采样失败';
      $('monitorStatus').classList.add('reject');
      $('monitorError').textContent = error.message;
    }
  } finally {
    if (S.monitorAbort === controller) S.monitorAbort = null;
    if (button?.isConnected) button.disabled = false;
    if (generation === S.monitorGeneration && S.page === 'monitoring' && !document.hidden)
      S.monitorTimer = setTimeout(() => refreshHostMetrics(generation), 5000);
  }
}

function renderHostMetrics(data) {
  const number = x => x == null ? '—' : Number(x).toFixed(1) + '%';
  const rate = x => x == null ? '等待采样' : formatBytes(x) + '/s';
  const choices = [{name:'auto', label:'默认路由网卡'}, ...data.interfaces.map(n => ({name:n.name,label:n.name}))];
  if (!choices.some(n => n.name === S.monitorNic)) S.monitorNic = 'auto';
  const net = S.monitorNic === 'auto' ? data.network : data.interfaces.find(n => n.name === S.monitorNic);
  const root = data.disks.find(d => d.mount === '/') || data.disks[0];
  const metric = (icon,title,value,detail,percent) => `<article class="monitor-metric"><span class="metric-label">${uiIcon(icon)}${esc(title)}</span><strong class="metric-value">${esc(value)}</strong><span class="metric-detail">${esc(detail)}</span>${percent != null ? `<progress class="usage-progress" max="100" value="${esc(percent)}" aria-label="${esc(title)}"></progress>` : ''}</article>`;
  const days = Math.floor(data.uptime / 86400), hours = Math.floor(data.uptime % 86400 / 3600);
  S.monitorHistory ||= new Map();
  const key = data.serverId + '/' + S.monitorNic;
  const history = S.monitorHistory.get(key) || [];
  if (!data.stale && net?.rxBytesPerSecond != null && history.at(-1)?.time !== data.sampledAt) {
    history.push({time:data.sampledAt,rx:net.rxBytesPerSecond,tx:net.txBytesPerSecond});
    if (history.length > 60) history.shift();
    S.monitorHistory.set(key, history);
    if (S.monitorHistory.size > 64) S.monitorHistory.delete(S.monitorHistory.keys().next().value);
  }
  const max = Math.max(1, ...history.flatMap(x => [x.rx,x.tx]));
  const points = field => history.map((v,i) => `${(i / Math.max(1,history.length-1) * 600).toFixed(1)},${(140-v[field]/max*130).toFixed(1)}`).join(' ');
  $('monitorBody').innerHTML = `<div class="monitor-grid">
    ${metric('cpu','CPU 使用率',number(data.cpuPercent),data.cores + ' 核 · 负载 ' + data.load.map(x=>Number(x).toFixed(2)).join(' / '),data.cpuPercent)}
    ${metric('memory-stick','内存使用率',number(data.memory.percent),formatBytes(data.memory.used) + ' / ' + formatBytes(data.memory.total),data.memory.percent)}
    ${metric('hard-drive','系统磁盘',root ? number(root.percent) : '不可用',root ? root.mount + ' · 可用 ' + formatBytes(root.available) : '未读取到挂载点',root?.percent)}
    ${metric('arrow-down-to-line','入站网速',rate(net?.rxBytesPerSecond),'累计接收 ' + (net?.rxBytes == null ? '—' : formatBytes(net.rxBytes)))}
    ${metric('arrow-up-from-line','出站网速',rate(net?.txBytesPerSecond),'累计发送 ' + (net?.txBytes == null ? '—' : formatBytes(net.txBytes)))}
    ${metric('activity','持续运行',days + ' 天 ' + hours + ' 小时',data.warmingUp ? '网速与 CPU 需要两次采样计算' : '网卡累计流量自开机 / 计数器重置起计算')}
    </div><section class="panel"><div class="panel-head"><h3>网络吞吐趋势</h3><select id="monitorNic" aria-label="选择监控网卡">${choices.map(n=>`<option value="${esc(n.name)}" ${n.name===S.monitorNic?'selected':''}>${esc(n.label)}</option>`).join('')}</select></div>
    <div class="toolbar"><span class="monitor-rx">${uiIcon('arrow-down-to-line')}入站 ${rate(net?.rxBytesPerSecond)}</span><span class="monitor-tx">${uiIcon('arrow-up-from-line')}出站 ${rate(net?.txBytesPerSecond)}</span><span class="hint">纵轴上限 ${rate(max)} · 最近 ${history.length} 次有效采样</span></div>
    <svg class="monitor-chart" viewBox="0 0 600 150" preserveAspectRatio="none" role="img" aria-label="最近有效采样的入站与出站网速趋势"><path class="chart-grid" d="M0 10H600 M0 75H600 M0 140H600"/><polyline class="rx-line" points="${points('rx')}"/><polyline class="tx-line" points="${points('tx')}"/></svg><div class="chart-axis"><span>${history.length ? esc(new Date(history[0].time * 1000).toLocaleTimeString()) : '等待有效采样'}</span><span>${history.length ? esc(new Date(history.at(-1).time * 1000).toLocaleTimeString()) : ''}</span></div><p class="hint">默认仅汇总默认路由网卡（${esc(data.summaryInterfaces.join(', ') || '未识别')}），避免重复叠加虚拟网卡。服务器网卡流量与订阅计费流量分别统计。</p></section>
    <div class="monitor-details"><section class="panel"><h3>主机与 IP 地址</h3><dl class="monitor-definition"><dt>SSH 目标 IP</dt><dd><code>${esc(data.managementIp)}</code></dd><dt>主机名</dt><dd>${esc(data.hostname)}</dd><dt>系统</dt><dd>${esc(data.os)} · ${esc(data.kernel)}</dd><dt>CPU</dt><dd>${esc(data.cpuModel)}</dd><dt>Swap</dt><dd>${formatBytes(data.memory.swapUsed)} / ${formatBytes(data.memory.swapTotal)}</dd><dt>网卡地址</dt><dd>${data.addresses.map(a=>`${esc(a.interface)} · <code>${esc(a.address)}</code>`).join('<br>') || '未读到地址（请确认远端已安装 iproute2）'}</dd></dl><p class="hint">网卡地址由服务器本机提供，不把内网地址推断为公网 IP；NAT 公网映射以 SSH 目标信息为准。</p></section>
    <section class="panel"><h3>每核 CPU</h3><div class="core-grid">${data.perCpu.slice(0,256).map(c=>`<div class="core-item">${esc(c.name)}<br><strong>${number(c.percent)}</strong></div>`).join('')}</div></section></div>
    <section class="panel"><h3>磁盘空间</h3><div class="tablewrap"><table><thead><tr><th>挂载点</th><th>文件系统</th><th>已用 / 总量</th><th>可用</th><th>使用率</th></tr></thead><tbody>${data.disks.map(d=>`<tr><td>${esc(d.mount)}</td><td>${esc(d.filesystem)}</td><td>${formatBytes(d.used)} / ${formatBytes(d.total)}</td><td>${formatBytes(d.available)}</td><td>${number(d.percent)}</td></tr>`).join('') || '<tr><td colspan="5">没有可显示的磁盘数据</td></tr>'}</tbody></table></div></section>`;
  $('monitorNic').onchange = () => { S.monitorNic = $('monitorNic').value; renderHostMetrics(S.monitorData); };
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(S.monitorTimer); S.monitorAbort?.abort(); }
  else if (S.page === 'monitoring') { if(S.monitorId) void refreshHostMetrics(); else renderMonitorOverview(); }
});


function remoteNodeEdit(id) {
  const row = S.remoteRows.find(x => x.id === id); if (!row) return;
  const {shareLinks,clientStats,...inbound} = row;
  openModal('编辑远端入站 JSON', '<form id="remoteEdit"><p class="muted">此处使用统一入站 JSON；后端会转换为对应内核配置并校验。独立内核端口不可直接修改。</p><textarea id="remoteJson" class="raw" spellcheck="false"></textarea><div id="remoteError" class="error"></div><button id="remoteSave" class="btn primary">保存到远端</button></form>');
  $('remoteJson').value = JSON.stringify(inbound,null,2);
  $('remoteEdit').onsubmit = async e => {
    e.preventDefault(); $('remoteSave').disabled = true;
    try { await api('/servers/inbounds',jsonOpt('PUT',{serverId:S.serverId,inboundId:id,inbound:JSON.parse($('remoteJson').value)})); closeModal(); await serverNodes(true); notice('远端入站已保存'); }
    catch (error) { if ($('remoteError')) { $('remoteError').textContent=error.message; $('remoteSave').disabled=false; } }
  };
}

async function remoteNodeToggle(id) {
  const row = S.remoteRows.find(x => x.id === id); if (!row) return;
  try { await api('/servers/inbounds',jsonOpt('PUT',{serverId:S.serverId,inboundId:id,inbound:{...row,enable:!row.enable}})); await serverNodes(true); }
  catch (error) { alert(error.message); }
}

async function remoteNodeDelete(id) {
  if (!confirm('删除该远端入站？本面板为其创建的中转路由也会清理；已导入订阅的链接需另行清理。')) return;
  try { await api('/servers/inbounds',jsonOpt('DELETE',{serverId:S.serverId,inboundId:id})); await serverNodes(true); notice('远端入站已删除'); }
  catch (error) { alert(error.message); }
}

async function importRemoteLinks(links, source) {
  const result = source ? await api('/servers/import',jsonOpt('POST',{...source,bind:false})) : await api('/import-node',jsonOpt('POST',{links:links.join('\n'),addToGroups:true}));
  if (!(result.added || result.existing) || result.failed?.length) throw Error(`导入 ${result.added || 0} 条；${result.failed?.map(x=>x.reason).join('；') || '未找到兼容节点'}`);
  await reload(false); notice(`已导入 ${result.added} 个节点到当前订阅`);
}

function remoteNodeLinks(id) {
  const row = S.remoteRows.find(x => x.id === id); if (!row) return;
  const serverId = S.serverId, profile = S.profile;
  const enforced = !!S.data?.profile?.traffic?.enforce, single = row.shareLinks.length === 1 && !sharedRemoteInbound(row);
  openModal('从服务器导入节点', `<form id="remoteImportForm"><p class="hint">选择需要导入当前订阅的连接。绑定限制以整个服务器入站为单位；多用户入站请只导入连接信息，另建专属入站用于强制限制。绑定后从当前计数开始累计，不自动计入历史流量，也不取消原面板已有的限额或有效期。</p>
    <div class="checks">${row.shareLinks.map((link,i)=>`<label class="choice"><input type="checkbox" class="remoteImportChoice" value="${i}" checked><span>连接 ${i+1} · ${esc(link.split('://')[0])}</span></label>`).join('')}</div>
    <details><summary>查看分享链接（含连接凭据）</summary><textarea id="remoteShare" readonly style="min-height:120px"></textarea><button type="button" id="remoteCopy" class="btn small">复制链接</button></details>
    <label class="inlinecheck"><input id="remoteBindOnImport" type="checkbox" ${single && enforced ? 'checked' : ''} ${single ? '' : 'disabled'}>导入并绑定当前订阅，联动流量额度与到期时间</label>
    <label id="remoteDedicatedBox" class="inlinecheck"><input id="remoteDedicated" type="checkbox">我确认整个入站仅供当前订阅使用，到期或超额可删除整个入站</label>
    <p class="hint">${enforced ? '当前订阅已启用强制限制，未绑定的入站必须选择绑定后导入。' : '仅导入连接信息不会自动启用服务器限制。绑定后还需在“流量与有效期”设置额度、到期时间并启用强制限制。'}${single ? '' : '此入站包含多个用户或连接，当前导入流程不允许整组绑定。'}</p>
    <div id="remoteImportError" class="error"></div><button id="remoteImport" class="btn primary">导入所选节点</button></form>`);
  $('remoteShare').value = row.shareLinks.join('\n');
  $('remoteCopy').onclick = () => copyText(row.shareLinks.join('\n'));
  const mode = () => { const bound = $('remoteBindOnImport').checked; $('remoteDedicatedBox').classList.toggle('hidden', !bound); $('remoteDedicated').required = bound; };
  $('remoteBindOnImport').onchange = mode; mode();
  $('remoteImportForm').onsubmit = async e => {
    e.preventDefault(); const button = $('remoteImport'); button.disabled = true;
    try {
      if (S.profile !== profile) throw Error('当前订阅已切换，请重新打开导入窗口');
      const indices = [...document.querySelectorAll('.remoteImportChoice:checked')].map(x=>Number(x.value));
      const opt = jsonOpt('POST', {serverId,inboundId:id,indices,bind:$('remoteBindOnImport').checked,confirmedDedicated:$('remoteDedicated').checked});
      opt.headers['X-Profile'] = profile;
      const result = await api('/servers/import', opt);
      closeModal();
      if (S.profile === profile) { await reload(false); if (S.page === 'serverNodes') renderRemoteNodes(); }
      notice(`已新增 ${result.added} 个，已有 ${result.existing} 个${result.bound ? '；已绑定订阅' : '；仅导入连接信息'}${result.bound && !result.enforcementEnabled ? '，请到流量与有效期启用强制限制' : ''}`);
    } catch (error) { if ($('remoteImportError')) $('remoteImportError').textContent=error.message; }
    finally { if (button?.isConnected) button.disabled=false; }
  };
}

function bandwidthLabel(value) {
  const up = value?.uploadKbps || 0, down = value?.downloadKbps || 0;
  return up || down ? `上行 ${up ? up/1000+' Mbps' : '不限'} / 下行 ${down ? down/1000+' Mbps' : '不限'} · 上次已应用` : '不限速';
}

function nodeBandwidthModal(encoded, id) {
  const serverId = decodeURIComponent(encoded), profile = S.profile;
  const binding = (S.data?.profile?.traffic?.bindings || []).find(b=>b.serverId===serverId && b.inboundId===id && b.status==='active');
  if (!binding) return alert('请先把专属入站绑定当前订阅，再设置带宽限制');
  const value = binding.bandwidth || {};
  openModal('订阅节点带宽限制', `<form id="nodeBandwidthForm"><p>当前订阅：${esc(S.data.profile.name)}<br>专属入站：${esc(binding.name || '')} · ${esc(serverId)} / ${id} · 端口 ${esc(binding.port)}</p>
    <div class="grid"><div><label for="bandwidthUpload">客户端上传上限（Mbps）</label><input id="bandwidthUpload" type="number" min="0.1" max="10000" step="0.001" value="${value.uploadKbps ? value.uploadKbps/1000 : ''}" placeholder="留空不限"></div>
    <div><label for="bandwidthDownload">客户端下载上限（Mbps）</label><input id="bandwidthDownload" type="number" min="0.1" max="10000" step="0.001" value="${value.downloadKbps ? value.downloadKbps/1000 : ''}" placeholder="留空不限"></div></div>
    <p class="hint">只限制这个专属入站，Mbps 与 MB/s 不同（8 Mbps 约为 1 MB/s）。需要服务器已安装 nftables、使用 systemd 且有 root 权限。超速流量会丢包，TCP 可能重传；允许短时突发，实际吞吐可能低于上限。独占端口，不支持共用入站内按单个用户分开限速。</p>
    <div id="bandwidthError" class="error"></div><div class="toolbar"><button id="bandwidthSave" class="btn primary">应用到服务器</button><button id="bandwidthClear" type="button" class="btn">取消此节点限速</button></div></form>`);
  const apply = async clear => {
    const save = $('bandwidthSave'), remove = $('bandwidthClear');save.disabled=remove.disabled=true;
    try {
      if (S.profile !== profile) throw Error('订阅已切换，请重新打开设置');
      const read = id => clear || !val(id) ? null : Number(val(id));
      const options = jsonOpt('PUT',{serverId,inboundId:id,uploadMbps:read('bandwidthUpload'),downloadMbps:read('bandwidthDownload')});
      options.headers['X-Profile'] = profile;
      await api('/servers/bandwidth',options);closeModal();
      if (S.profile === profile) {await reload(false);if(S.page==='traffic')traffic();else if(S.page==='serverNodes')renderRemoteNodes();}
      notice(clear ? '已取消该节点限速' : '服务器带宽限制已应用');
    } catch (error) {if($('bandwidthError'))$('bandwidthError').textContent=error.message;}
    finally {if(save?.isConnected){save.disabled=false;remove.disabled=false;}}
  };
  $('nodeBandwidthForm').onsubmit=e=>{e.preventDefault();void apply(false);};
  $('bandwidthClear').onclick=()=>apply(true);
}

function trafficSummary() {
  const t = S.data.profile?.traffic || { configured: false };
  const state = !t.configured ? '未配置' : t.expired ? '已到期' : t.exhausted ? '额度已用尽' : '使用中';
  return `<section class="panel usage-panel"><div class="panel-head"><h3>订阅流量</h3>
    <div class="toolbar"><span class="pill ${t.expired || t.exhausted ? 'reject' : ''}">${state}</span>
    ${S.page === 'traffic' ? '' : '<button class="btn small" onclick="go(\'traffic\')">管理额度</button>'}</div></div>
    ${t.configured ? `<div class="usage-grid">
      <div><span>已使用</span><strong>${formatBytes(t.used)}</strong></div>
      <div><span>${t.resetPeriod === 'monthly' ? '本月额度' : '总额度'}</span><strong>${formatBytes(t.total)}</strong></div>
      <div><span>剩余流量</span><strong>${formatBytes(t.remaining)}</strong></div>
      <div><span>到期时间</span><strong class="usage-date">${t.expire ? esc(new Date(t.expire * 1000).toLocaleString('zh-CN')) : '长期有效'}</strong></div>
    </div>${t.total != null ? `<progress class="usage-progress" max="100" value="${t.percent}" aria-label="流量已使用百分比"></progress><div class="hint">已用 ${t.percent}% · 上传 ${formatBytes(t.upload)} / 下载 ${formatBytes(t.download)}</div>` : ''}
    <div class="hint">按节点独立倍率计费 · 服务器原始采集 ${formatBytes(t.rawUsed || 0)}（不含手工录入）</div><div class="hint">${t.enforce ? '服务器累计' : '手动录入'} · 最近更新 ${t.updatedAt ? esc(new Date(t.updatedAt * 1000).toLocaleString('zh-CN')) : '—'}</div>`
    : '<p class="muted">尚未设置流量额度和有效期。设置后，三个客户端订阅会使用同一份流量信息。</p>'}
  </section>`;
}

function nodeMultiplierModal(encoded, inboundId) {
  const serverId = decodeURIComponent(encoded), profile = S.profile;
  const t = S.data.profile?.traffic || {};
  const binding = (t.bindings || []).find(b => b.serverId === serverId && b.inboundId === inboundId && b.status === 'active');
  if (!binding) return notice('请先将节点绑定当前订阅');
  openModal('节点流量倍率 · ' + (binding.name || inboundId), `<form id="nodeMultiplierForm"><label for="nodeMultiplier">此节点计费倍率</label><input id="nodeMultiplier" type="number" min="0" max="100" step="0.001" required value="${(binding.multiplierUnits ?? ((t.multiplier ?? 1) * 1000)) / 1000}"><p class="hint">只作用于此入站绑定节点。例如 2 倍：实际使用 1 GiB，订阅扣除 2 GiB。0 倍免流量计费，到期限制仍有效。修改前只连接这台服务器结算旧倍率，历史账单不重算；其他节点不受影响。</p><div id="nodeMultiplierError" class="error" role="alert"></div><button id="nodeMultiplierSave" type="submit" class="btn primary">结算并保存节点倍率</button></form>`);
  $('nodeMultiplierForm').onsubmit = async event => {
    event.preventDefault();
    const button = $('nodeMultiplierSave'), errorBox = $('nodeMultiplierError');
    button.disabled = true; errorBox.textContent = '';
    try {
      const result = await api('/servers/multiplier', {...jsonOpt('PUT', {serverId, inboundId, multiplier: Number(val('nodeMultiplier'))}), headers:{'Content-Type':'application/json','X-Profile':profile}});
      if (S.profile === profile) {
        binding.multiplierUnits = result.node.multiplier * 1000;
        if (result.traffic) S.data.profile.traffic = result.traffic;
        closeModal(); if (S.page === 'traffic') traffic();
      }
      notice('该节点流量倍率已保存');
    } catch (error) { if (errorBox.isConnected) { errorBox.textContent = error.message; button.disabled = false; } }
  };
}

function planDescription(p) {
  return `${p.durationMonths ?? 12} 个月 · ${p.resetPeriod === 'none' ? '一次性流量' : '每月重置'} · ${p.speedMbps ? p.speedMbps + ' Mbps' : '无限速'} · ${p.multiplier ?? 1} 倍`;
}

function subscriptionPlanModal(encoded = '') {
  const id = decodeURIComponent(encoded);
  const plan = (S.data?.profile?.traffic?.plans || []).find(p => p.id === id);
  if (id && !plan) return notice('模板不存在，请刷新');
  const p = plan || {name:'',price:null,monthlyGiB:50,durationMonths:12,resetPeriod:'monthly',speedMbps:0,multiplier:1};
  const profile = S.profile;
  openModal(plan ? '编辑套餐模板' : '新建套餐模板', `<form id="planForm"><div class="grid">
    <div><label for="planName">模板名称</label><input id="planName" maxlength="60" required value="${esc(p.name)}"></div>
    <div><label for="planPrice">价格（元 / 整个有效期）</label><input id="planPrice" type="number" min="0" max="100000000" step="any" value="${p.price == null ? '' : esc(p.price)}" placeholder="留空表示未设置"></div>
    <div><label for="planQuota">流量额度（GiB）</label><input id="planQuota" type="number" min="0.001" max="1000000" step="any" required value="${esc(p.monthlyGiB)}"></div>
    <div><label for="planPeriod">流量周期</label><select id="planPeriod"><option value="monthly">每月重置</option><option value="none">一次性总流量</option></select></div>
    <div><label for="planMonths">有效期（月）</label><input id="planMonths" type="number" min="1" max="120" step="1" required value="${p.durationMonths ?? 12}"></div>
    <div><label for="planSpeed">节点上传 / 下载限速（Mbps）</label><input id="planSpeed" type="number" min="0" max="10000" step="0.001" value="${p.speedMbps || 0}"><p class="hint">0 或留空表示无限速；非零至少 0.1 Mbps。</p></div>
    <div><label for="planMultiplier">节点流量倍率</label><input id="planMultiplier" type="number" min="0" max="100" step="0.001" required value="${p.multiplier ?? 1}"></div>
    </div><p class="hint">模板由所有订阅共用。保存或删除模板不会修改已套用的订阅；只有点击套用才下发配置。价格仅作备注，不自动收款。</p><div id="planError" class="error" role="alert"></div><button id="planSave" class="btn primary" type="submit">保存模板</button></form>`);
  $('planPeriod').value = p.resetPeriod || 'monthly';
  $('planForm').onsubmit = async e => {
    e.preventDefault(); const button = $('planSave'); button.disabled = true;
    try {
      const body = {id: id || undefined, name:$('planName').value, price:$('planPrice').value === '' ? null : Number($('planPrice').value),
        monthlyGiB:Number($('planQuota').value),durationMonths:Number($('planMonths').value),resetPeriod:$('planPeriod').value,
        speedMbps:Number($('planSpeed').value || 0),multiplier:Number($('planMultiplier').value)};
      const result = await api('/traffic/plans', jsonOpt('PUT', body));
      if (S.profile !== profile) return;
      S.data.profile.traffic = result.traffic; closeModal();
      if (S.page === 'traffic') traffic();
      notice('模板已保存；需要套用后才影响订阅');
    } catch(error) { if ($('planError')) $('planError').textContent = error.message; }
    finally { button.disabled = false; }
  };
}

async function deleteSubscriptionPlan(encoded) {
  const id = decodeURIComponent(encoded), profile = S.profile;
  if (!confirm('删除这个套餐模板？已套用订阅的额度、用量、有效期和节点配置保持不变。')) return;
  try {
    const result = await api('/traffic/plans/delete', jsonOpt('PUT', {id}));
    if (S.profile !== profile) return;
    S.data.profile.traffic = result.traffic; if (S.page === 'traffic') traffic();
    notice('模板已删除，已套用订阅不受影响');
  } catch(error) { notice(error.message); }
}

function trafficBindings(t) {
  const active = (t.bindings || []).filter(b => b.status === 'active');
  const history = (t.bindings || []).filter(b => b.status !== 'active');
  const labels = {active:'有效',detached:'已解绑',revoked:'已撤销',missing:'远端已不存在'};
  return `<h3>有效绑定节点（${active.length}）</h3><div class="tablewrap"><table><thead><tr><th>专属入站</th><th>服务器 / ID</th><th>状态 / 限速</th><th>操作 / 错误</th></tr></thead><tbody>${active.map(b => `<tr><td>${esc(b.name || '')} : ${b.port}</td><td>${esc(b.serverId)} / ${b.inboundId}</td><td>${b.monthlyPaused ? '月额度暂停' : '有效'} · ${esc((b.multiplierUnits ?? ((t.multiplier ?? 1) * 1000)) / 1000)} 倍<div class="hint">${bandwidthLabel(b.bandwidth)}</div><div class="hint">${b.counterSource === 'authenticated-client' ? '认证用户流量' : b.counterSource === 'pending' ? '等待首次采集' : '入站/端口流量（含连接开销）'} · 本次采集 ${formatBytes(b.lastRawDelta || 0)}${b.lastSampleAt ? ' · '+esc(new Date(b.lastSampleAt * 1000).toLocaleTimeString('zh-CN')) : ''}</div></td><td><button type="button" class="btn small" onclick="nodeBandwidthModal('${encodeURIComponent(b.serverId).replace(/'/g,'%27')}',${b.inboundId})">节点带宽限制</button><button type="button" class="btn small" onclick="nodeMultiplierModal('${encodeURIComponent(b.serverId).replace(/'/g,'%27')}',${b.inboundId})">节点流量倍率</button><div class="error">${esc(b.error || '')}</div></td></tr>`).join('') || '<tr><td colspan="4" class="empty">暂无有效绑定节点，请到服务器节点创建或绑定专属入站</td></tr>'}</tbody></table></div>
  ${history.length ? `<details id="trafficHistory"><summary>失效历史绑定（${history.length}）</summary><p class="hint">这些不是当前有效节点，已停止计量；历史计费用量仍保留。清理记录不会连接服务器或删除远端节点。</p><div class="tablewrap"><table><thead><tr><th>历史节点</th><th>状态</th><th>历史错误</th></tr></thead><tbody>${history.map(b=>`<tr><td>${esc(b.name || '')} : ${b.port}<div class="hint">${esc(b.serverId)} / ${b.inboundId}</div></td><td>${esc(labels[b.status] || b.status)}</td><td>${esc(b.error || '—')}</td></tr>`).join('')}</tbody></table></div><button id="trafficCleanup" class="btn small danger" type="button">清理失效历史绑定</button></details>` : ''}`;
}

function traffic() {
  const t = S.data.profile?.traffic || {};
  let unit = 1024 ** 3;
  const localDate = t.expire ? new Date(t.expire * 1000) : null;
  const dateValue = localDate ? new Date(localDate.getTime() - localDate.getTimezoneOffset() * 60000).toISOString().slice(0, 19) : '';
  $('content').innerHTML = trafficSummary() + `<section class="panel">
    <div class="panel-head"><h3>订阅套餐模板</h3><button type="button" class="btn" onclick="subscriptionPlanModal()">新建模板</button></div>
    <p class="muted">模板可自定义名称、价格、额度、有效期、重置周期、节点限速与倍率。修改模板不会自动修改已套用的订阅，订阅链接保持不变。</p>
    <div class="profile-grid">${(t.plans || []).map(p => { const id=encodeURIComponent(p.id).replace(/'/g,'%27');return `<article class="profile-card ${p.id === t.planId ? 'is-current' : ''}"><div class="profile-card-head"><h4>${esc(p.name)}</h4><span class="pill">${p.price == null ? '价格未设置' : '¥' + esc(p.price) + ' / ' + (p.durationMonths ?? 12) + '个月'}</span></div><p><strong>${esc(p.monthlyGiB)} GiB${p.resetPeriod === 'none' ? ' 总额' : ' / 月'}</strong></p><div class="hint">${esc(planDescription(p))}</div>${p.id === t.planId ? '<div class="hint">当前已套用（修改后需重新套用）</div>' : ''}<div class="toolbar"><button type="button" class="btn small" onclick="subscriptionPlanModal('${id}')">编辑模板</button><button type="button" class="btn small danger" onclick="deleteSubscriptionPlan('${id}')">删除模板</button></div></article>`;}).join('')}</div>
    <div class="toolbar"><select id="trafficPlan" aria-label="订阅套餐模板"><option value="">请选择套餐模板</option>${(t.plans || []).map(p => `<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.monthlyGiB)} GiB${p.resetPeriod === 'none' ? ' 总额' : '/月'}${p.price == null ? ' · 价格未设置' : ' · ¥' + esc(p.price)}</option>`).join('')}</select><button id="trafficPlanApply" type="button" class="btn primary">套用到当前订阅</button></div>
    <p class="hint">首次套用按模板月数计算有效期；月套餐按开通日（UTC）重置，月底日期取当月最后一天。再次套用保留到期日和已用量，不自动续期或清零。模板限速和倍率应用到当前绑定节点，并由后续新建节点继承；连接服务器失败请核对已成功下发的节点后重试。</p>
    ${t.planId ? `<p class="hint">当前：${esc(t.planName)} · ${t.price == null ? '价格未设置' : '价格 ¥' + esc(t.price)}${t.nextResetAt ? ' · 下次重置 ' + esc(new Date(t.nextResetAt * 1000).toLocaleString('zh-CN')) : ''}</p>` : ''}
    <div id="trafficPlanError" class="error" role="alert"></div>
    </section><section class="panel">
    <div class="panel-head"><h3>流量额度与有效期</h3><div class="client-badges"><span>Clash / Mihomo</span><span>V2Ray</span><span>Shadowrocket</span></div></div>
    <p class="muted">当前订阅：${esc(S.data.profile?.name || '')}。启用服务器强制限制后，后台每 30 秒巡检并累计该订阅专属入站用量；月套餐额度用尽暂停节点，下个周期恢复；一次性额度用尽或订阅到期会删除绑定入站及中转路由，订阅链接返回 403。删除后续期需重新创建节点。未绑定节点、外部节点和 Mihomo 客户端用量不能由总控强制控制。</p>
    <form id="trafficForm"><div class="grid">
      <div><label for="trafficUnit">流量单位</label><select id="trafficUnit"><option value="1073741824">GiB（1 GiB = 1024 MiB）</option><option value="1048576">MiB</option><option value="1099511627776">TiB</option></select></div>
      <div><label for="trafficTotal">${t.resetPeriod === 'monthly' ? '每月流量额度' : '总流量额度'}</label><input id="trafficTotal" type="number" min="0" step="any" placeholder="留空表示不限" value="${t.total != null ? t.total / unit : ''}"></div>
      <div><label for="trafficUpload">已用上传计费流量</label><input id="trafficUpload" type="number" min="0" step="any" required value="${(t.upload || 0) / unit}"></div>
      <div><label for="trafficDownload">已用下载计费流量</label><input id="trafficDownload" type="number" min="0" step="any" required value="${(t.download || 0) / unit}"></div>
      <div class="span2"><label for="trafficExpire">到期时间（当前设备本地时间）</label><input id="trafficExpire" type="datetime-local" step="1" value="${dateValue}"><p class="hint">留空表示长期有效；已用流量为上传与下载之和。客户端是否显示额度取决于其版本。</p></div>
    </div><label class="inlinecheck"><input id="trafficEnforce" type="checkbox" ${t.enforce || !t.configured ? 'checked' : ''}>启用服务器强制限制（月额用尽暂停，到期删除专属入站）</label><p class="hint">仅套用套餐不自动开启强制计量，请先绑定专属节点，再勾选此项保存。独立 Xray / sing-box 启用计量前需在远端安装 nftables。计量包含网络协议开销；阈值存在巡检延迟，离线服务器的暂停、恢复、撤销会持续重试。请勿把其他用户共用入站绑定到此订阅。</p><div class="toolbar"><button id="trafficSync" class="btn" type="button">立即同步用量 / 重试撤销</button></div>
    ${trafficBindings(t)}${t.enforcementError && (t.bindings || []).some(b=>b.status==='active') ? `<p class="error">${esc(t.enforcementError)}</p>` : ''}
    <div id="trafficError" class="error" role="alert"></div><div class="toolbar">
      <button id="trafficSave" class="btn primary" type="submit">保存并同步订阅信息</button>
      <button id="trafficDisable" class="btn" type="button" ${!t.configured ? 'disabled' : ''}>关闭限制与信息展示</button>
    </div></form></section>`;
  $('trafficPlan').value = t.planId || '';
  $('trafficPlanApply').onclick = async () => {
    const planId = $('trafficPlan').value;
    if (!planId) { $('trafficPlanError').textContent = '请先选择套餐模板'; return; }
    const plan = (t.plans || []).find(p=>p.id===planId);
    if (!plan || !confirm(`将“${plan.name}”套用到当前订阅？${planDescription(plan)}。保留已用量，再次套用不自动续期。`)) return;
    const profile = S.profile, button = $('trafficPlanApply');
    $('trafficSave').disabled = $('trafficDisable').disabled = true;
    button.disabled = true; button.textContent = '正在结算并套用…';
    $('trafficPlanError').textContent = '';
    try {
      const result = await api('/traffic/plan', jsonOpt('PUT', {planId}));
      if (S.profile !== profile) return;
      S.data.profile.traffic = result.traffic;
      const record = S.profiles.find(p => p.id === profile);
      if (record) record.traffic = result.traffic;
      if (S.page === 'traffic') traffic();
      notice('套餐已套用，原订阅链接不变');
    } catch (error) {
      if (S.profile === profile && $('trafficPlanError')) $('trafficPlanError').textContent = error.message;
    } finally {
      button.disabled = false; button.textContent = '套用到当前订阅';
      if (S.profile === profile && S.page === 'traffic' && $('trafficSave')) {
        $('trafficSave').disabled = false; $('trafficDisable').disabled = !S.data?.profile?.traffic?.configured;
      }
    }
  };
  if ($('trafficCleanup')) $('trafficCleanup').onclick = async () => {
    if (!confirm('只清理当前订阅已解绑、已撤销和远端缺失的历史绑定？已计费用量保留，不删除任何远端节点。')) return;
    const profile = S.profile, button=$('trafficCleanup');button.disabled=true;
    try {
      const result=await api('/traffic/bindings/cleanup',jsonOpt('PUT',{confirmed:true}));
      if(S.profile!==profile)return;
      S.data.profile.traffic=result.traffic;
      if(S.page==='traffic')traffic();
      notice(`已清理 ${result.removed} 条失效历史绑定，计费用量保留`);
    }catch(error){if($('trafficError'))$('trafficError').textContent=error.message;}
    finally{button.disabled=false;}
  };
  $('trafficSync').onclick = async () => {
    $('trafficSync').disabled = true;
    try { await api('/traffic/sync', jsonOpt('POST', {})); await reload(); }
    catch (error) { if ($('trafficError')) $('trafficError').textContent = error.message; }
    finally { if ($('trafficSync')) $('trafficSync').disabled = false; }
  };
  $('trafficUnit').onchange = e => {
    const next = Number(e.target.value);
    ['trafficTotal', 'trafficUpload', 'trafficDownload'].forEach(id => {
      if ($(id).value !== '') $(id).value = Math.round(Number($(id).value) * unit) / next;
    });
    unit = next;
  };
  const save = async payload => {
    const profile = S.profile;
    $('trafficSave').disabled = $('trafficDisable').disabled = true;
    try {
      const result = await api('/traffic', jsonOpt('PUT', payload));
      if (S.profile !== profile) return;
      if (S.data?.profile) S.data.profile.traffic = result.traffic;
      const record = S.profiles.find(p => p.id === profile);
      if (record) record.traffic = result.traffic;
      if (S.page === 'traffic') traffic();
      notice('额度与限制策略已保存');
    } catch (error) {
      if (S.page === 'traffic' && S.profile === profile) {
        $('trafficError').textContent = error.message;
        $('trafficSave').disabled = false;
        $('trafficDisable').disabled = !t.configured;
      }
    }
  };
  $('trafficForm').onsubmit = e => {
    e.preventDefault();
    try {
      const bytes = id => {
        if ($(id).value === '') return null;
        const result = Math.round(Number($(id).value) * unit);
        if (!Number.isSafeInteger(result) || result < 0) throw Error('流量数值超出范围，请检查单位');
        return result;
      };
      const expire = $('trafficExpire').value ? new Date($('trafficExpire').value).getTime() / 1000 : null;
      if (expire !== null && (!Number.isSafeInteger(expire) || expire <= 0)) throw Error('请选择有效的到期时间');
      const upload = bytes('trafficUpload'), download = bytes('trafficDownload');
      void save({ enabled: true, enforce: $('trafficEnforce').checked, upload, download, total: bytes('trafficTotal'), expire,
        preserveUsage: upload === (t.upload || 0) && download === (t.download || 0) });
    } catch (error) { $('trafficError').textContent = error.message; }
  };
  $('trafficDisable').onclick = () => { if (confirm('关闭该订阅的额度、有效期限制及流量信息展示？节点带宽限制仍保留，已删除节点不会恢复。')) void save({ enabled: false }); };
}

function cards() {
  return `<div class="cards">
    <div class="card"><span>节点</span><b>${S.data.nodes.length}</b></div>
    <div class="card"><span>策略组</span><b>${S.data.groups.length}</b></div>
    <div class="card"><span>路由规则</span><b>${S.data.rules.length}</b></div>
    <div class="card"><span>DNS 分流</span><b>${S.data.dnsPolicies.length}</b></div>
  </div>`;
}

function conversionRows(formats) {
  return formats.map(f => {
    const skipped = f.skipped || [], unit = f.unit || '节点';
    let details = `<div class="hint">${esc(f.note)} · 可导出 ${esc(f.supported)} 个${esc(unit)}，跳过 ${skipped.length} 项</div>`;
    if (skipped.length) details += `<details style="margin-top:8px;"><summary>查看不兼容项目 (${skipped.length})</summary><div class="note">${skipped.map(x => `${esc(x.name)} (${esc(x.type)}): ${esc(x.reason)}`).join('<br>')}</div></details>`;
    if (f.available === false) return `<div class="note"><b>${esc(f.name)}</b>${details}<p>${esc(f.error || '当前没有兼容项目')}</p></div>`;
    return subscriptionRow(f.name, `可导出 ${f.supported} 个${unit}`, location.origin + f.url, f.url, details);
  }).join('');
}

function subscriptionRow(name, description, url, href, details = '') {
  let encodedUrl = encodeURIComponent(url).replace(/'/g, '%27');
  let encodedName = encodeURIComponent(name).replace(/'/g, '%27');
  let qr = '/admin/api/qrcode?url=' + encodedUrl;
  return `
    <div class="subscription-row">
      <div style="min-width:0">
        <b>${esc(name)}</b>
        <div class="muted">${esc(description)}</div>
        <code>${esc(url)}</code>
        ${details}
      </div>
      <div class="subscription-actions">
        <button class="btn small" onclick="copyText(decodeURIComponent('${encodedUrl}'))">复制</button>
        <a class="btn small primary" href="${esc(href)}">下载</a>
      </div>
      <button class="subscription-qr-button" onclick="openSubscriptionQr('${encodedUrl}','${encodedName}')" title="点击放大二维码">
        <img class="subscription-qr" src="${esc(qr)}" alt="${esc(name)}订阅二维码">
      </button>
    </div>`;
}

function openSubscriptionQr(encodedUrl, encodedName) {
  let url = decodeURIComponent(encodedUrl), name = decodeURIComponent(encodedName);
  let qr = '/admin/api/qrcode?url=' + encodeURIComponent(url);
  openModal('QR_IMPORT // ' + name, `
    <div style="text-align:center">
      <img src="${esc(qr)}" alt="${esc(name)}订阅二维码" style="width:min(320px,100%);background:var(--white);padding:12px;border-radius:10px;">
      <div class="note" style="text-align:left;overflow-wrap:anywhere;">${esc(url)}</div>
      <button class="btn primary" onclick="copyText(decodeURIComponent('${encodeURIComponent(url)}'))">复制订阅链接</button>
    </div>`);
}

async function overview() {
  const profile = S.profile;
  let p = S.profiles.find(x => x.id === S.profile) || S.data.profile;
  let url = location.origin + p.url;
  $('content').innerHTML = cards() + trafficSummary() + `
  <section class="panel">

function updateNodeSelectionUi() {
  let boxes = [...document.querySelectorAll('.node-select')];
  boxes.forEach(box => { box.checked = S.nodeSelection.has(box.dataset.nodeSelect); });
  let selectedVisible = boxes.filter(box => box.checked).length;
  let master = $('nodeSelectAll');
  if (master) {
    master.disabled = boxes.length === 0;
    master.checked = boxes.length > 0 && selectedVisible === boxes.length;
    master.indeterminate = selectedVisible > 0 && selectedVisible < boxes.length;
  }
  if ($('nodeSelectedCount')) $('nodeSelectedCount').textContent = `已选择 ${S.nodeSelection.size} 个`;
  if ($('bulkDeleteButton')) $('bulkDeleteButton').disabled = S.nodeSelection.size === 0;
}

function toggleNodeSelection(input) {
  if (input.checked) S.nodeSelection.add(input.dataset.nodeSelect);
  else S.nodeSelection.delete(input.dataset.nodeSelect);
  updateNodeSelectionUi();
}

function toggleAllVisibleNodes(checked) {
  document.querySelectorAll('.node-select').forEach(box => {
    if (checked) S.nodeSelection.add(box.dataset.nodeSelect);
    else S.nodeSelection.delete(box.dataset.nodeSelect);
  });
  updateNodeSelectionUi();
}

function selectAllNodes() {
  S.data.nodes.forEach(node => S.nodeSelection.add(node.name));
  updateNodeSelectionUi();
}

function clearNodeSelection() {
  S.nodeSelection.clear();
  updateNodeSelectionUi();
}

function setupNodeDrag() {
  let dragged = '';
  let rows = [...document.querySelectorAll('#nodeRows tr[data-node-name]')];
  let clearMarks = () => rows.forEach(row => row.classList.remove('dragging', 'drag-before', 'drag-after'));
  rows.forEach(row => {
    let handle = row.querySelector('.drag-handle');
    handle.ondragstart = event => {
      dragged = row.dataset.nodeName;
      row.classList.add('dragging');
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', dragged);
    };
    handle.ondragend = () => { dragged = ''; clearMarks(); };
    row.ondragover = event => {
      if (!dragged || dragged === row.dataset.nodeName) return;
      event.preventDefault();
      clearMarks();
      let rect = row.getBoundingClientRect();
      row.classList.add(event.clientY < rect.top + rect.height / 2 ? 'drag-before' : 'drag-after');
    };
    row.ondrop = async event => {
      event.preventDefault();
      let position = row.classList.contains('drag-after') ? 'after' : 'before';
      let targetName = row.dataset.nodeName;
      clearMarks();
      if (!dragged || dragged === targetName) return;
      await dragNode(dragged, targetName, position);
      dragged = '';
    };
  });
}

  openModal('多入口主备 · 固定出口', `<form id="failoverForm"><div class="grid">

    <div><label>各入口新建端口</label><input id="foPort" type="number" min="1" max="65535" value="24443" required></div>
    <div><label>Reality SNI</label><input id="foSni" value="raw.githubusercontent.com" required></div>
  </div><p class="hint">每个入口会新建专属服务器转发，均绑定当前订阅的流量和到期限制。原有节点保持原配置。请确认端口空闲且防火墙放行；创建期间请勿关闭窗口。</p>
  <fieldset class="section"><legend>加入业务策略组</legend>${groupChecks(S.data.groups.filter(g => g.type === 'select').map(g => g.name), 'foGroup')}</fieldset>
  <div id="formError" class="error"></div><button class="btn primary">创建服务器转发和主备组</button></form>`);
  const addEntry = (name) => {
    const row = document.createElement('div'); row.className = 'toolbar';
    row.innerHTML = `<select class="foEntry">${options(normal.map(n => n.name), name)}</select><button type="button" class="btn small danger">移除</button>`;
    row.querySelector('button').onclick = () => row.remove();

      const entries = [...document.querySelectorAll('.foEntry')].map(x => x.value);

function ordinaryNodes() {
  return S.data.nodes.filter(x => !x.config?.['dialer-proxy'] && !(S.failovers || []).some(f => f.paths.includes(x.name)));
}

function inferChainExit(chain) {
  if (!chain) return ordinaryNodes()[0]?.name || '';
  let keys = ['type', 'server', 'port', 'uuid', 'password', 'cipher'];
  let found = ordinaryNodes().find(n => keys.every(k => String(n.config?.[k] ?? '') === String(chain.config?.[k] ?? '')));
  return found?.name || ordinaryNodes()[0]?.name || '';
}

function groupChecks(selected, klass = 'chainGroup') {
  let set = new Set(selected || []);
  return `
  <div class="toolbar" style="margin-bottom:8px;">
    <button type="button" class="btn small" onclick="document.querySelectorAll('.${klass}').forEach(x=>x.checked=true)">全选</button>
    <button type="button" class="btn small" onclick="document.querySelectorAll('.${klass}').forEach(x=>x.checked=false)">清空</button>
  </div>
  <div class="checks">
    ${S.data.groups.filter(g => !g.name.includes('广告拦截')).map(g => `
      <label class="choice">

        <span>${esc(g.name)} <small class="muted">(${esc(optionLabel(g.type))})</small></span>
      </label>
    `).join('')}
  </div>`;
}

async function previewSubscription() {
  let box = $('subPreview'), button = $('previewSub');
  $('formError').textContent = '';
  if (!val('sourceSubUrl')) return $('formError').textContent = '请填写来源订阅链接';
  button.disabled = true;
  box.textContent = '>> 正在连接远端订阅服务器并解析数据包，请稍候...';
  try {
    let d = await api('/import-subscription/preview', jsonOpt('POST', { url: val('sourceSubUrl') }));
    let protocols = Object.entries(d.protocols).map(([k, v]) => `${optionLabel(k)} ${v} 个`).join('、');
    box.innerHTML = `[SUCCESS] 成功解析 <b>${d.total}</b> 个有效节点：${esc(protocols)}。${d.skipped.length ? `（另有 ${d.skipped.length} 项格式不兼容已忽略）` : ''}`;
    $('confirmSubImport').disabled = false;
  } catch (e) {
    box.textContent = '[ERROR] 读取订阅失败';
    $('formError').textContent = e.message;
    $('confirmSubImport').disabled = true;
  } finally {
    button.disabled = false;
  }
}

async function confirmSubscriptionImport(e) {
  e.preventDefault();
  if ($('confirmSubImport').disabled) return;
  let button = $('confirmSubImport');
  button.disabled = true;
  $('formError').textContent = '';
  try {
    let d = await api('/import-subscription', jsonOpt('POST', {
      url: val('sourceSubUrl'),
      conflict: val('subConflict'),
      groups: [...document.querySelectorAll('.importGroup:checked')].map(x => x.value)
    }));
    await reload(false);
    notice(`成功导入 ${d.added + d.replaced} 个节点`);
    await subscriptions();
  } catch (err) {
    $('formError').textContent = err.message;
    button.disabled = false;
  }
}

async function uninstallManager(e) {
  e.preventDefault();
  let purgeData = $('uninstallMode').value === 'purge';
  if ($('uninstallConfirmation').value !== 'UNINSTALL') return alert('请输入大写 UNINSTALL 确认卸载');
  let text = purgeData
    ? '这会移除管理后台并删除主 Clash 订阅文件。确认彻底卸载？'
    : '确认卸载管理后台？用户数据会先归档到 /var/backups。';
  if (!confirm(text)) return;
  try {
    let result = await api('/uninstall', jsonOpt('POST', {
      username: $('uninstallUser').value,
      password: $('uninstallPassword').value,
      confirmation: $('uninstallConfirmation').value,
      purgeData
    }));
    $('content').innerHTML = `
      <section class="panel">
        <h3>UNINSTALL_STARTED // 卸载任务已启动</h3>
        <div class="note">管理后台将在几秒内停止，当前页面随后无法继续访问。</div>
        ${result.backupPath ? `<p>用户数据归档位置：<code>${esc(result.backupPath)}</code></p>` : '<p>已选择彻底清除用户数据。</p>'}
      </section>`;
  } catch (error) {
    alert(error.message);
  }
}

function openModal(title, html) {
  closeSniScanner();
  if ($('modal').classList.contains('hidden')) S.modalFocus = document.activeElement;
  $('modalTitle').textContent = title.replace(/^[A-Z_0-9 ]+\s*\/\/\s*/, '');
  $('modalBody').innerHTML = html;
  $('modal').classList.remove('hidden');
  document.body.classList.add('modal-open');
  $('modal').querySelector('.modalbox').focus();
}

function closeModal() {
  closeSniScanner();
  if ($('modal').classList.contains('hidden')) return;
  $('modal').querySelectorAll('input[type="password"]').forEach(input => { input.value = ''; });
  S.jobView = null;
  $('modal').classList.add('hidden');
  document.body.classList.remove('modal-open');
  if (S.modalFocus?.isConnected) S.modalFocus.focus();
  S.modalFocus = null;
}

function optionLabel(x) { return OPTION_LABELS[x] || x; }
function nodeProtocol(x) { return x?.type === 'http' && x?.config?.tls ? 'HTTPS' : optionLabel(x?.type || ''); }
function options(items, current) {
  return items.map(x => `<option value="${esc(x)}" ${String(x) === String(current) ? 'selected' : ''}>${esc(optionLabel(x))}</option>`).join('');
}

function val(id) { return ($(id)?.value || '').trim(); }
function on(id) { return !!$(id)?.checked; }
function numberOrText(x) { let n = Number(x); return x !== '' && Number.isFinite(n) ? n : x; }

function protocolFields(type, cfg = {}) {
  let net = cfg.network || 'tcp';
  let ro = cfg['reality-opts'] || {};
  let go = cfg['grpc-opts'] || {};
  let wo = cfg['ws-opts'] || {};
  let host = wo.headers?.Host || wo.headers?.host || '';

  if (type === 'vless') return `
    <h4 class="protocol-title">VLESS 认证与传输参数</h4>
    <div class="grid">
      <div><label>UUID</label><input id="nUuid" required value="${esc(cfg.uuid || '')}"></div>

      <div><label>Flow 流控</label><select id="nFlow">${options(['', 'xtls-rprx-vision'], cfg.flow || '')}</select></div>
      <div><label>数据包编码</label><select id="nPacket">${options(['', 'xudp', 'packetaddr'], cfg['packet-encoding'] || '')}</select></div>
      <div><label>TLS SNI / Server Name</label><input id="nSni" value="${esc(cfg.servername || '')}"></div>
      <div><label>客户端指纹</label><select id="nFingerprint">${options(['chrome', 'firefox', 'safari', 'edge', 'random', ''], cfg['client-fingerprint'] || 'chrome')}</select></div>
      <div><label>Reality 公钥 PBK</label><input id="nPbk" value="${esc(ro['public-key'] || '')}"></div>
      <div><label>Reality Short ID</label><input id="nSid" value="${esc(ro['short-id'] || '')}"></div>
      <div class="span2 inlinecheck"><input id="nTls" type="checkbox" ${cfg.tls !== false ? 'checked' : ''}><span>启用 TLS / Reality 安全连接</span></div>
      <div class="span2 inlinecheck"><input id="nSkip" type="checkbox" ${cfg['skip-cert-verify'] ? 'checked' : ''}><span>跳过服务端证书验证 (skip-cert-verify)</span></div>
    </div>
    <div id="transportFields"></div>`;

  if (type === 'tuic') return `
    <h4 class="protocol-title">TUIC 认证与传输参数</h4>
    <div class="grid">
      <div><label>UUID</label><input id="nUuid" required value="${esc(cfg.uuid || '')}"></div>
      <div><label>密码</label><input id="nPassword" required value="${esc(cfg.password || '')}"></div>
      <div><label>TLS SNI</label><input id="nSni" value="${esc(cfg.sni || '')}"></div>
      <div><label>ALPN（逗号分隔）</label><input id="nAlpn" value="${esc((cfg.alpn || ['h3']).join?.(',') || cfg.alpn || 'h3')}"></div>
      <div class="span2"><label>TLS 证书 SHA-256 指纹</label><input id="nCertFingerprint" value="${esc(cfg.fingerprint || '')}" placeholder="自签证书节点用于安全校验，可由链接自动生成"></div>
      <div><label>拥塞控制算法</label><select id="nCongestion">${options(['bbr', 'cubic', 'new_reno'], cfg['congestion-controller'] || 'bbr')}</select></div>
      <div><label>UDP 中继模式</label><select id="nUdpRelay">${options(['native', 'quic'], cfg['udp-relay-mode'] || 'native')}</select></div>
      <div><label>心跳间隔 (ms)</label><input id="nHeartbeat" type="number" value="${esc(cfg['heartbeat-interval'] || 10000)}"></div>
      <div><label>请求超时 (ms)</label><input id="nTimeout" type="number" value="${esc(cfg['request-timeout'] || 8000)}"></div>
      <div class="inlinecheck"><input id="nReduceRtt" type="checkbox" ${cfg['reduce-rtt'] ? 'checked' : ''}><span>减少 RTT</span></div>
      <div class="inlinecheck"><input id="nSkip" type="checkbox" ${cfg['skip-cert-verify'] ? 'checked' : ''}><span>跳过证书验证</span></div>
    </div>`;

  if (type === 'hysteria2') return `
    <h4 class="protocol-title">Hysteria2 认证与传输参数</h4>
    <div class="grid">
      <div><label>认证密码</label><input id="nPassword" required value="${esc(cfg.password || cfg.auth || '')}"></div>
      <div><label>TLS SNI</label><input id="nSni" value="${esc(cfg.sni || '')}"></div>
      <div><label>ALPN（逗号分隔）</label><input id="nAlpn" value="${esc((cfg.alpn || ['h3']).join?.(',') || cfg.alpn || 'h3')}"></div>
      <div><label>混淆类型</label><select id="nObfs">${options(['', 'salamander'], cfg.obfs || '')}</select></div>
      <div><label>混淆密码</label><input id="nObfsPassword" value="${esc(cfg['obfs-password'] || '')}"></div>
      <div class="span2"><label>TLS 证书 SHA-256 指纹</label><input id="nCertFingerprint" value="${esc(cfg.fingerprint || '')}" placeholder="自签证书安全校验"></div>
      <div><label>上传带宽 (Up)</label><input id="nUp" value="${esc(cfg.up || '')}" placeholder="例如 50 Mbps"></div>
      <div><label>下载带宽 (Down)</label><input id="nDown" value="${esc(cfg.down || '')}" placeholder="例如 200 Mbps"></div>
      <div class="span2 inlinecheck"><input id="nSkip" type="checkbox" ${cfg['skip-cert-verify'] ? 'checked' : ''}><span>跳过证书验证</span></div>
    </div>`;

  if (type === 'trojan') return `
    <h4 class="protocol-title">Trojan 认证与传输参数</h4>
    <div class="grid">
      <div><label>密码</label><input id="nPassword" required value="${esc(cfg.password || '')}"></div>
      <div><label>传输方式</label><select id="nNetwork" onchange="renderTransport()">${options(['tcp', 'grpc', 'ws'], net)}</select></div>
      <div><label>TLS SNI</label><input id="nSni" value="${esc(cfg.sni || cfg.servername || '')}"></div>
      <div><label>客户端指纹</label><select id="nFingerprint">${options(['chrome', 'firefox', 'safari', 'edge', 'random', ''], cfg['client-fingerprint'] || 'chrome')}</select></div>
      <div class="span2 inlinecheck"><input id="nSkip" type="checkbox" ${cfg['skip-cert-verify'] ? 'checked' : ''}><span>跳过证书验证</span></div>
    </div>
    <div id="transportFields"></div>`;

  if (type === 'ss') return `
    <h4 class="protocol-title">Shadowsocks 认证参数</h4>
    <div class="grid">
      <div><label>加密算法</label><select id="nCipher">${options(['2022-blake3-aes-128-gcm', '2022-blake3-aes-256-gcm', 'aes-128-gcm', 'aes-256-gcm', 'chacha20-ietf-poly1305'], cfg.cipher || 'aes-256-gcm')}</select></div>
      <div><label>密码</label><input id="nPassword" required value="${esc(cfg.password || '')}"></div>
    </div>`;

  if (type === 'socks5') return `
    <h4 class="protocol-title">SOCKS5 认证与传输参数</h4>
    <div class="grid">
      <div><label>用户名（无认证可留空）</label><input id="nUsername" value="${esc(cfg.username || '')}"></div>
      <div><label>密码（无认证可留空）</label><input id="nPassword" value="${esc(cfg.password || '')}"></div>
      <div><label>TLS SNI / Server Name</label><input id="nSni" value="${esc(cfg.servername || '')}" placeholder="仅 TLS SOCKS5 需要"></div>
      <div class="inlinecheck"><input id="nTls" type="checkbox" ${cfg.tls ? 'checked' : ''}><span>启用 TLS 加密连接</span></div>
      <div class="span2 inlinecheck"><input id="nSkip" type="checkbox" ${cfg['skip-cert-verify'] ? 'checked' : ''}><span>跳过服务端证书验证 (skip-cert-verify)</span></div>
    </div>
    <div class="note">支持无认证或用户名/密码认证；作为链式代理出口时，在“链式代理”页面选择此节点为出口即可。</div>`;

  if (type === 'http' || type === 'https') {
    let headers = cfg.headers || {};
    let secure = type === 'https';
    return `
    <h4 class="protocol-title">${secure ? 'HTTPS' : 'HTTP'} 代理认证与连接参数</h4>
    <div class="grid">
      <div><label>用户名（无认证可留空）</label><input id="nUsername" value="${esc(cfg.username || '')}"></div>
      <div><label>密码（无认证可留空）</label><input id="nPassword" value="${esc(cfg.password || '')}"></div>
      <div><label>Host 请求头（可选）</label><input id="nHttpHost" value="${esc(headers.Host || headers.host || '')}" placeholder="例如 proxy.example.com"></div>
      <div><label>User-Agent 请求头（可选）</label><input id="nHttpUa" value="${esc(headers['User-Agent'] || headers['user-agent'] || '')}" placeholder="例如 Mozilla/5.0"></div>
      ${secure ? `
      <div><label>TLS SNI</label><input id="nSni" value="${esc(cfg.sni || '')}" placeholder="默认使用服务器域名"></div>
      <div><label>证书域名校验（可选）</label><input id="nNameCertVerify" value="${esc(cfg['name-cert-verify'] || '')}" placeholder="例如 proxy.example.com"></div>
      <div class="span2"><label>TLS 证书 SHA-256 指纹（可选）</label><input id="nCertFingerprint" value="${esc(cfg.fingerprint || '')}"></div>
      <div class="span2 inlinecheck"><input id="nSkip" type="checkbox" ${cfg['skip-cert-verify'] ? 'checked' : ''}><span>跳过服务端证书验证 (skip-cert-verify)</span></div>` : ''}
    </div>
    <div class="note">标准 HTTP CONNECT 代理只支持 TCP；${secure ? '保存后写入 type: http 与 tls: true。' : '账号和密码均可留空。'}可在“链式代理”页面选作出口节点。</div>`;
  }

  return `
    <h4 class="protocol-title">VMess 认证与传输参数</h4>
    <div class="grid">
      <div><label>UUID</label><input id="nUuid" required value="${esc(cfg.uuid || '')}"></div>
      <div><label>Alter ID</label><input id="nAlterId" type="number" value="${esc(cfg.alterId ?? cfg['alter-id'] ?? 0)}"></div>
      <div><label>加密算法</label><select id="nCipher">${options(['auto', 'none', 'zero'], cfg.cipher || 'auto')}</select></div>
      <div><label>传输方式</label><select id="nNetwork" onchange="renderTransport()">${options(['tcp', 'grpc', 'ws'], net)}</select></div>
      <div><label>TLS SNI</label><input id="nSni" value="${esc(cfg.servername || '')}"></div>
      <div class="inlinecheck"><input id="nTls" type="checkbox" ${cfg.tls ? 'checked' : ''}><span>启用 TLS</span></div>
      <div class="span2 inlinecheck"><input id="nSkip" type="checkbox" ${cfg['skip-cert-verify'] ? 'checked' : ''}><span>跳过证书验证</span></div>
    </div>
    <div id="transportFields"></div>`;
}

function renderTransport() {
  let cfg = window.nodeDraft || {};
  let net = val('nNetwork');
  let go = cfg['grpc-opts'] || {};
  let wo = cfg['ws-opts'] || {};
  let host = wo.headers?.Host || wo.headers?.host || '';
  let box = $('transportFields');
  if (!box) return;

  box.innerHTML = net === 'grpc' ? `
    <div class="grid">
      <div class="span2"><label>gRPC Service Name</label><input id="nGrpcService" value="${esc(go['grpc-service-name'] || 'grpc')}"></div>
    </div>` : net === 'ws' ? `
    <div class="grid">
      <div><label>WebSocket 路径</label><input id="nWsPath" value="${esc(wo.path || '/')}"></div>
      <div><label>WebSocket Host</label><input id="nWsHost" value="${esc(host)}"></div>
    </div>` : '';
}

function renderProtocol() {
  let type = val('nType');
  let box = $('protocolBox');
  if (box) {
    box.innerHTML = protocolFields(type, window.nodeDraft || {});
    let udp = $('nUdp');
    if (udp) {
      udp.disabled = ['http', 'https'].includes(type);
      if (udp.disabled) udp.checked = false;
    }
    renderTransport();
    if ($('nUuid')) {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'btn small'; button.textContent = '生成新 UUID';
      button.onclick = () => { $('nUuid').value = crypto.randomUUID(); $('nUuid').dispatchEvent(new Event('input', {bubbles:true})); };
      $('nUuid').insertAdjacentElement('afterend', button);
    }
  }
}

function readNodeForm() {
  let type = val('nType');
  let port = numberOrText(val('nPort'));
  let cfg = { ...(window.nodeDraft || {}), name: val('nName'), type, server: val('nServer'), port, udp: on('nUdp') };

  if (type === 'vless') {
    cfg.uuid = val('nUuid');
    cfg.network = val('nNetwork');
    cfg.tls = on('nTls');
    cfg.encryption = 'none';
    if (val('nFlow')) cfg.flow = val('nFlow'); else delete cfg.flow;
    if (val('nPacket')) cfg['packet-encoding'] = val('nPacket'); else delete cfg['packet-encoding'];
    if (val('nSni')) cfg.servername = val('nSni'); else delete cfg.servername;
    if (val('nFingerprint')) cfg['client-fingerprint'] = val('nFingerprint');
    if (val('nPbk')) cfg['reality-opts'] = { 'public-key': val('nPbk'), 'short-id': val('nSid') }; else delete cfg['reality-opts'];
    if (on('nSkip')) cfg['skip-cert-verify'] = true; else delete cfg['skip-cert-verify'];
  } else if (type === 'tuic') {
    Object.assign(cfg, {
      uuid: val('nUuid'),
      password: val('nPassword'),
      sni: val('nSni'),
      'congestion-controller': val('nCongestion'),
      'udp-relay-mode': val('nUdpRelay'),
      alpn: val('nAlpn').split(',').map(x => x.trim()).filter(Boolean),
      'heartbeat-interval': Number(val('nHeartbeat')),
      'request-timeout': Number(val('nTimeout'))
    });
    if (val('nCertFingerprint')) cfg.fingerprint = val('nCertFingerprint'); else delete cfg.fingerprint;
    if (on('nReduceRtt')) cfg['reduce-rtt'] = true; else delete cfg['reduce-rtt'];
    if (on('nSkip')) cfg['skip-cert-verify'] = true; else delete cfg['skip-cert-verify'];
  } else if (type === 'hysteria2') {
    cfg.password = val('nPassword');
    cfg.alpn = val('nAlpn').split(',').map(x => x.trim()).filter(Boolean);
    if (val('nSni')) cfg.sni = val('nSni'); else delete cfg.sni;
    if (val('nCertFingerprint')) cfg.fingerprint = val('nCertFingerprint'); else delete cfg.fingerprint;
    if (val('nObfs')) cfg.obfs = val('nObfs'); else delete cfg.obfs;
    if (val('nObfsPassword')) cfg['obfs-password'] = val('nObfsPassword'); else delete cfg['obfs-password'];
    if (val('nUp')) cfg.up = val('nUp'); else delete cfg.up;
    if (val('nDown')) cfg.down = val('nDown'); else delete cfg.down;
    if (on('nSkip')) cfg['skip-cert-verify'] = true; else delete cfg['skip-cert-verify'];
  } else if (type === 'trojan') {
    cfg.password = val('nPassword');
    cfg.network = val('nNetwork');
    if (val('nSni')) cfg.sni = val('nSni');
    if (val('nFingerprint')) cfg['client-fingerprint'] = val('nFingerprint');
    if (on('nSkip')) cfg['skip-cert-verify'] = true;
  } else if (type === 'ss') {
    cfg.cipher = val('nCipher');
    cfg.password = val('nPassword');
  } else if (type === 'socks5') {
    if (val('nUsername')) cfg.username = val('nUsername'); else delete cfg.username;
    if (val('nPassword')) cfg.password = val('nPassword'); else delete cfg.password;
    if (val('nSni')) cfg.servername = val('nSni'); else delete cfg.servername;
    cfg.tls = on('nTls');
    if (on('nSkip')) cfg['skip-cert-verify'] = true; else delete cfg['skip-cert-verify'];
  } else if (type === 'http' || type === 'https') {
    cfg.type = 'http';
    cfg.udp = false;
    if (type === 'https') cfg.tls = true; else delete cfg.tls;
    if (val('nUsername')) cfg.username = val('nUsername'); else delete cfg.username;
    if (val('nPassword')) cfg.password = val('nPassword'); else delete cfg.password;
    if (val('nSni')) cfg.sni = val('nSni'); else delete cfg.sni;
    if (val('nNameCertVerify')) cfg['name-cert-verify'] = val('nNameCertVerify'); else delete cfg['name-cert-verify'];
    if (val('nCertFingerprint')) cfg.fingerprint = val('nCertFingerprint'); else delete cfg.fingerprint;
    if (on('nSkip')) cfg['skip-cert-verify'] = true; else delete cfg['skip-cert-verify'];
    let headers = {};
    if (val('nHttpHost')) headers.Host = val('nHttpHost');
    if (val('nHttpUa')) headers['User-Agent'] = val('nHttpUa');
    if (Object.keys(headers).length) cfg.headers = headers; else delete cfg.headers;
  } else {
    cfg.uuid = val('nUuid');
    cfg.alterId = Number(val('nAlterId') || 0);
    cfg.cipher = val('nCipher');
    cfg.network = val('nNetwork');
    cfg.tls = on('nTls');
    if (val('nSni')) cfg.servername = val('nSni');
    if (on('nSkip')) cfg['skip-cert-verify'] = true;
  }

  if (['vless', 'trojan', 'vmess'].includes(type)) {
    let net = val('nNetwork');
    if (net === 'grpc') cfg['grpc-opts'] = { 'grpc-service-name': val('nGrpcService') };
    if (net === 'ws') {
      cfg['ws-opts'] = { path: val('nWsPath') || '/' };
      if (val('nWsHost')) cfg['ws-opts'].headers = { Host: val('nWsHost') };
    }
  }
  if (val('nDialer')) cfg['dialer-proxy'] = val('nDialer'); else delete cfg['dialer-proxy'];
  return cfg;
}

function nodeModal(index) {
  let x = index == null ? null : S.data.nodes.find(n => n.index === index);
  let cfg = x?.config || { name: '', type: 'vless', server: '', port: 443, udp: true, tls: true };
  let formType = cfg.type === 'http' && cfg.tls ? 'https' : cfg.type;
  let dialers = ['', ...S.data.nodes.filter(n => n.name !== x?.name).map(n => n.name), ...S.data.groups.filter(g => g.name !== x?.name && !g.name.includes('广告拦截')).map(g => g.name)];
  window.nodeDraft = cfg;

  openModal(x ? 'EDIT_NODE // 编辑节点' : 'NEW_NODE // 新增节点', `
  <form id="editForm">
    <fieldset class="section">
      <legend>基本网络参数</legend>
      <div class="grid">
        <div>
          <label>节点名称</label>
          <input id="nName" required value="${esc(cfg.name || '')}" placeholder="例如 美国 Mxioc VLESS">
        </div>
        <div>
          <label>协议类型</label>
          <select id="nType" onchange="window.nodeDraft={};renderProtocol()">${options(['vless', 'tuic', 'hysteria2', 'trojan', 'ss', 'vmess', 'socks5', 'http', 'https'], formType || 'vless')}</select>
        </div>
        <div>
          <label>服务器域名 / IP</label>
          <input id="nServer" required value="${esc(cfg.server || '')}" placeholder="例如 node.example.com">
        </div>
        <div>
          <label>服务端口</label>
          <input id="nPort" type="number" min="1" max="65535" required value="${esc(cfg.port || 443)}">
        </div>
        <div class="span2">
          <label>前置中转节点（链式代理）</label>
          <select id="nDialer">${options(dialers, cfg['dialer-proxy'] || '')}</select>
          <div class="hint">不选择表示直连该节点；选择后将先建立到中继节点的通道再访问此落地节点。</div>
        </div>
        <div class="span2 inlinecheck">
          <input id="nUdp" type="checkbox" ${cfg.udp !== false ? 'checked' : ''}>
          <span>启用 UDP 转发支持</span>
        </div>
      </div>
    </fieldset>

    <fieldset class="section">
      <legend>协议深度参数</legend>
      <div id="protocolBox"></div>
    </fieldset>

    ${x ? '' : `
    <label class="inlinecheck">
      <input id="addAll" type="checkbox" checked>
      <span>自动加入全部业务代理策略组（广告拦截组除外）</span>
    </label>`}

    <div id="formError" class="error"></div>
    <div class="toolbar" style="margin-top:16px;"><button id="nodePreview" class="btn" type="button">校验与预览</button><button id="nodeSave" class="btn primary" type="submit">保存节点</button></div><div id="nodePreviewResult" class="preview-result hidden" role="status"></div>
  </form>`);

  renderProtocol();
  let draftRevision = 0;
  $('editForm').addEventListener('input', () => { draftRevision++; if ($('nodePreviewResult')) $('nodePreviewResult').classList.add('hidden'); });
  $('nodePreview').onclick = async () => {
    const output = $('nodePreviewResult'), button = $('nodePreview'), revision = draftRevision;
    button.disabled = true; $('formError').textContent = '';
    try {
      const data = await api('/nodes/validate', jsonOpt('POST', {config:readNodeForm()}));
      if ($('nodePreviewResult') !== output) return;
      if (revision !== draftRevision) { $('formError').textContent = '配置已变更，请重新校验'; return; }
      output.classList.remove('hidden');
      output.innerHTML = `<strong>配置校验通过 · 尚未保存</strong><p class="hint">协议 ${esc(optionLabel(data.config.type))} · 服务器 ${esc(data.config.server)}:${esc(data.config.port)}</p><details><summary>查看规范化配置（含认证信息）</summary><pre></pre></details>${data.uri ? '<p class="hint">支持导出通用单节点分享链接。</p>' : '<p class="hint">该链路需要 Mihomo 客户端配置，不能用单节点链接表达。</p>'}`;
      output.querySelector('pre').textContent = JSON.stringify(data.config, null, 2);
    } catch (error) { if ($('formError')) $('formError').textContent = error.message; }
    finally { if (button.isConnected) button.disabled = false; }
  };
  $('editForm').onsubmit = async e => {
    e.preventDefault();
    const button = $('nodeSave');
    button.disabled = true;
    try {
      let config = readNodeForm();
      const result = await api('/nodes', jsonOpt(x ? 'PUT' : 'POST', { config, oldName: x?.name, addToGroups: $('addAll')?.checked }));
      closeModal();
      if (!result.unchanged) await reload();
      notice(result.unchanged ? '配置没有变化，无需重复保存' : '节点配置已保存并转换为 YAML');
    } catch (err) {
      if ($('formError')) $('formError').textContent = err.message;
    } finally { if (button.isConnected) button.disabled = false; }
  };
}

function groupModal(index) {
  let x = index == null ? null : S.data.groups.find(n => n.index === index);
  let cfg = x?.config || { name: '', type: 'select', proxies: ['DIRECT', '✈️ Proxy'] };
  window.groupDraft = cfg;

function downloadNodeLink(filename, uri) {
  let blob = new Blob([uri + '\n'], { type: 'text/plain;charset=utf-8' });
  let url = URL.createObjectURL(blob);
  let link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  notice('节点连接已导出');
}

async function restoreBackup(e) {
  let name = decodeURIComponent(e);
  if (confirm(`确认回滚恢复历史快照“${name}”？`)) {
    try {
      await api('/backups/restore', jsonOpt('POST', { name }));
      await reload();
      notice('快照备份已成功恢复');
    } catch (x) {
      alert(x.message);
    }
  }
}

// Global Form Submissions & Event Handlers
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  const submit = $('loginForm').querySelector('[type="submit"]');
  submit.disabled = true;
  $('loginError').textContent = '';
  try {
    let r = await fetch('/admin/api/login', jsonOpt('POST', {
      username: $('user').value,
      password: $('pass').value
    }));
    let d = await r.json();
    if (!r.ok) throw Error(d.error);
    S.token = null;
    sessionStorage.removeItem('mxioc_token');
    localStorage.removeItem('mxioc_token');
    await showAuthenticatedApp();
  } catch (x) {
    $('loginError').textContent = x.message;
  } finally {
    submit.disabled = false;
  }
};

document.querySelectorAll('.nav').forEach(n => n.onclick = () => { if(n.dataset.page==='monitoring')S.monitorId=''; return go(n.dataset.page).catch(error => notice('加载失败：' + error.message)); });
$('modalClose').onclick = closeModal;
$('modal').onclick = e => { if (e.target === $('modal')) e.stopPropagation(); };
document.addEventListener('keydown', e => {
  if(S.sniScan) { if(e.key==='Escape'){e.preventDefault();closeSniScanner();} return; }
  if ($('modal').classList.contains('hidden')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key !== 'Tab') return;
  const focusable = [...$('modal').querySelectorAll('button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), a[href]')].filter(el => el.getClientRects().length);
  if (!focusable.length) { e.preventDefault(); return; }
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (e.shiftKey && (document.activeElement === first || document.activeElement.classList.contains('modalbox'))) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && (document.activeElement === last || document.activeElement.classList.contains('modalbox'))) {
    e.preventDefault(); first.focus();
  }
});

$('logout').onclick = () => logout(true);
$('manageProfiles').onclick = profileManager;
$('refresh').onclick = async () => {
  try {
    if (S.page === 'monitoring') {
      await refreshHostMetrics();
    } else if (S.page === 'servers') {
      await servers();
    } else if (S.page === 'serverNodes') {
      await serverNodes(true);
    } else if (S.page === 'profiles') {
      await loadProfiles();
      if (S.page === 'profiles') profiles();
    } else {
      await reload();
    }
    notice('配置数据已同步刷新');
  } catch (e) {
    alert(e.message);
  }
};
$('importNode').onclick = importNodeModal;
$('bootRetry').onclick = bootstrap;
$('add').onclick = () => ({
  nodes: nodeModal,
  chains: chainModal,
  groups: groupModal,
  rules: ruleModal,
  dns: dnsModal
}[S.page])();

void bootstrap();
