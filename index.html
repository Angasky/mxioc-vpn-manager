<!doctype html>
<html lang="zh-CN" data-theme="high">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MXIOC // Terminal Control Center</title>
<script>
try { document.documentElement.dataset.theme = ['high', 'low', 'pink'].includes(localStorage.getItem('mxioc_theme')) ? localStorage.getItem('mxioc_theme') : 'high'; } catch (_) {}
</script>
<style>
:root {
  --bg: #0b1120;
  --bg-card: #121b2c;
  --bg-card-hover: #18253a;
  --bg-sidebar: #0d1524;
  --bg-input: #0d1524;
  --border: #233249;
  --border-focus: #38bdf8;
  --border-glow: rgba(56, 189, 248, 0.25);
  --blue: #38bdf8;
  --blue-bright: #7dd3fc;
  --blue-dim: #0284c7;
  --blue-soft: rgba(56, 189, 248, 0.12);
  --cyan: #22d3ee;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --text-dim: #b9c7d8;
  --green: #10b981;
  --green-soft: rgba(16, 185, 129, 0.12);
  --amber: #f59e0b;
  --amber-soft: rgba(245, 158, 11, 0.12);
  --danger: #f43f5e;
  --danger-soft: rgba(244, 63, 94, 0.14);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Source Code Pro', Consolas, 'SF Mono', Monaco, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

  color-scheme: dark;
  --accent-rgb: 56 189 248; --success-rgb: 16 185 129; --danger-rgb: 244 63 94;
  --warning-rgb: 245 158 11; --shadow-rgb: 0 0 0; --overlay-rgb: 4 7 14;
  --surface-inset: #090e1a; --surface-header: #162236;
  --primary-bg: #1679c9; --primary-hover: #208bdc; --primary-border: #258edc;
  --success-text: #34d399; --danger-text: #fb7185; --danger-strong: #ffe4e6;
  --placeholder: #8093af; --white: #ffffff;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(ellipse at 75% 0%, rgb(var(--accent-rgb) / 0.035), transparent 60%);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  letter-spacing: 0.01em;
  min-height: 100vh;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--surface-inset); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--blue-dim); }

.hidden { display: none !important; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .nav:focus-visible {
  outline: 2px solid var(--blue-bright);
  outline-offset: 2px;
}

.boot {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.boot-card {
  width: min(380px, 100%);
  padding: 30px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--bg-card);
  box-shadow: 0 24px 70px rgb(var(--shadow-rgb) / .4);
  text-align: center;
}
.boot-mark {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  margin: 0 auto 18px;
  border: 1px solid var(--blue);
  border-radius: 12px;
  color: var(--blue-bright);
  font: 800 22px var(--font-mono);
  box-shadow: 0 0 22px var(--border-glow);
}
.boot-title { margin: 0 0 6px; font: 700 16px var(--font-mono); }
.boot-status { margin: 0 0 18px; color: var(--text-dim); }
.boot-progress {
  height: 3px;
  overflow: hidden;
  border-radius: 3px;
  background: var(--border);
}
.boot-progress::after {
  content: '';
  display: block;
  width: 35%;
  height: 100%;
  background: var(--blue);
  animation: boot-scan 1.3s ease-in-out infinite alternate;
}
@keyframes boot-scan { to { transform: translateX(190%); } }
.boot.failed .boot-progress { display: none; }

/* ==================== LOGIN TERMINAL ==================== */
.login {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.loginbox {
  width: min(460px, 100%);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 20px 60px rgb(var(--shadow-rgb) / 0.7), 0 0 25px rgb(var(--accent-rgb) / 0.08);
  padding: 0;
  overflow: hidden;
  position: relative;
}
.login-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--surface-inset);
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--blue);
}
.window-dots {
  display: flex;
  gap: 6px;
}
.window-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}
.dot-red { background: var(--danger); box-shadow: 0 0 6px rgb(var(--danger-rgb) / 0.6); }
.dot-yellow { background: var(--amber); box-shadow: 0 0 6px rgb(var(--warning-rgb) / 0.6); }
.dot-green { background: var(--green); box-shadow: 0 0 6px rgb(var(--success-rgb) / 0.6); }

.login-body {
  padding: 32px;
}
.login-identity { margin-bottom: 24px; font-size: 30px; font-weight: 750; letter-spacing: 2px; }
.login-identity span { display: block; color: var(--text-muted); font-size: 13px; font-weight: 400; letter-spacing: .02em; margin-top: 5px; }
.ascii-logo {
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1.15;
  color: var(--blue);
  white-space: pre;
  margin: 0 0 16px 0;
  text-shadow: 0 0 10px rgb(var(--accent-rgb) / 0.35);
  user-select: none;
}
.login-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 22px;
  line-height: 1.6;
  border-left: 2px solid var(--blue-dim);
  padding-left: 10px;
}
.login-meta b {
  color: var(--blue-bright);
}

label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  margin: 16px 0 6px;
}
label::before {
  content: none;
  color: var(--blue);
  font-weight: bold;
}
input, select, textarea {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  min-height: 38px;
  padding: 9px 12px;
  outline: none;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 13px;
  transition: all 0.15s ease;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px var(--border-glow), 0 0 12px rgb(var(--accent-rgb) / 0.15);
  background: var(--surface-inset);
}
input::placeholder, textarea::placeholder {
  color: var(--placeholder);
  font-family: var(--font-mono);
}
select option {
  background: var(--surface-inset);
  color: var(--text);
}
textarea {
  min-height: 130px;
  resize: vertical;
  line-height: 1.5;
}

/* ==================== BUTTONS ==================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  padding: 8px 14px;
  min-height: 36px;
  cursor: pointer;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  transition: background-color .12s, border-color .12s, color .12s;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover {
  background: var(--bg-card-hover);
  border-color: var(--blue-dim);
  color: var(--blue-bright);
  box-shadow: none;
}
.btn:active {
  transform: translateY(1px);
}
.btn.primary {
  background: var(--primary-bg);
  border-color: var(--primary-border);
  color: var(--white);
  box-shadow: none;
}
.btn.primary:hover {
  background: var(--primary-hover);
  border-color: var(--blue-bright);
  box-shadow: none;
}
.btn.danger {
  background: rgb(var(--danger-rgb) / 0.08);
  border-color: rgb(var(--danger-rgb) / 0.3);
  color: var(--danger-text);
}
.btn.danger:hover {
  background: rgb(var(--danger-rgb) / 0.18);
  border-color: var(--danger);
  box-shadow: none;
  color: var(--danger-strong);
}
.btn.small {
  padding: 4px 8px;
  min-height: 29px;
  font-size: 11px;
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}
.full { width: 100%; margin-top: 18px; }
.error {
  min-height: 20px;
  color: var(--danger-text);
  font-family: var(--font-mono);
  font-size: 12px;
  margin-top: 10px;
}
.error:not(:empty)::before {
  content: '[ERR] ';
  color: var(--danger);
  font-weight: bold;
}

/* ==================== APP LAYOUT ==================== */
.app {
  display: flex;
  min-height: 100vh;
}
.side {
  position: sticky;
  top: 0;
  height: 100vh;
  width: 250px;
  flex-shrink: 0;
  padding: 16px 12px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}
.side-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 10px 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 14px;
}
.side-logo {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  border: 1px solid var(--blue);
  color: var(--blue);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 800;
  box-shadow: none;
}
.side-brand h1 {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  margin: 0;
  color: var(--text);
  letter-spacing: 0.5px;
}
.side-brand p {
  margin: 2px 0 0;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--blue);
  opacity: 0.8;
}

.nav-group {
  flex: 1;
  overflow-y: auto;
}
.nav-section-title {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 10px 10px 4px;
  user-select: none;
}
.nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 41px;
  padding: 9px 12px;
  margin: 2px 0;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-dim);
  font-family: var(--font-sans);
  font-size: 14px;
  border: 1px solid transparent;
  background: transparent;
  text-align: left;
  transition: all 0.15s ease;
}
.nav:hover {
  background: rgb(var(--accent-rgb) / 0.05);
  border-color: rgb(var(--accent-rgb) / 0.15);
  color: var(--blue-bright);
}
.nav.active {
  background: rgb(var(--accent-rgb) / 0.12);
  border-color: rgb(var(--accent-rgb) / .25);
  color: var(--white);
  box-shadow: none;
}
.nav i {
  width: 18px;
  text-align: center;
  font-style: normal;
  color: var(--blue);
  font-size: 12px;
}
.nav.active i {
  color: var(--blue-bright);
  text-shadow: none;
}
.side-status {
  padding: 12px 10px 6px;
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: none;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ==================== MAIN CONTENT ==================== */
.main {
  min-width: 0;
  flex: 1;
  padding: 28px clamp(18px, 3vw, 42px);
}
.top {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  align-items: flex-start;
}
.top-title-area {
  display: flex;
  flex-direction: column;
  flex: 1 1 280px;
}
.cli-breadcrumb {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--blue);
  margin-bottom: 4px;
}
.cli-breadcrumb span {
  color: var(--text-muted);
}
.top h2 {
  font-size: 22px;
  font-weight: 700;
  margin: 0;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.top h2::before {
  content: none;
  font-size: 12px;
  color: var(--blue);
}
.top p {
  color: var(--text-muted);
  margin: 3px 0 0;
  font-size: 12px;
  font-family: var(--font-mono);
}
.actions, .toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.actions select { width: min(220px, 100%); }
.actions { flex: 1 1 560px; justify-content: flex-end; }
.toolbar input { max-width: 320px; }
.toolbar select { max-width: 200px; }

/* ==================== HUD CARDS ==================== */
.cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
  transition: all 0.15s ease;
}
.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: var(--blue-dim);
  opacity: 0.5;
}
.card:hover {
  border-color: rgb(var(--accent-rgb) / 0.35);
  box-shadow: none;
}
.card:hover::before {
  background: var(--blue);
  box-shadow: none;
  opacity: 1;
}
.card span {
  display: block;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.card span::before {
  content: '// ';
  color: var(--blue-dim);
}
.card b {
  display: block;
  margin-top: 6px;
  font-family: var(--font-mono);
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
}

/* ==================== PANELS ==================== */
.panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 20px;
  box-shadow: 0 8px 25px rgb(var(--shadow-rgb) / 0.22);
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.panel h3 {
  font-family: var(--font-sans);
  font-size: 16px;
  color: var(--text);
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel h3::before {
  content: '';
  color: var(--blue);
}

/* ==================== TABLE ==================== */
.tablewrap {
  overflow-x: auto;
  max-height: 68vh;
  margin-top: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-inset);
}
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 760px;
  font-size: 13px;
}
th, td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  white-space: nowrap;
}
th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--surface-header);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  border-bottom: 1px solid rgb(var(--accent-rgb) / 0.2);
}
tr:last-child td {
  border-bottom: none;
}
tbody tr {
  transition: background 0.12s ease;
}
tbody tr:hover {
  background: rgb(var(--accent-rgb) / 0.04);
}

.drag-handle {
  cursor: grab;
  color: var(--blue-bright);
  font-size: 18px;
  user-select: none;
}
.drag-handle:active { cursor: grabbing; }
tbody tr.dragging { opacity: .42; }
tbody tr.drag-before { box-shadow: inset 0 2px 0 var(--blue-bright); }
tbody tr.drag-after { box-shadow: inset 0 -2px 0 var(--blue-bright); }
code {
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface-inset);
  border: 1px solid var(--border);
  color: var(--blue);
  font-family: var(--font-mono);
  font-size: 12px;
}
.pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 12px;
  background: rgb(var(--accent-rgb) / 0.1);
  border: 1px solid rgb(var(--accent-rgb) / 0.25);
  color: var(--blue-bright);
  font-family: var(--font-mono);
  font-size: 11px;
}
.pill.direct {
  background: var(--green-soft);
  border-color: rgb(var(--success-rgb) / 0.3);
  color: var(--success-text);
}
.pill.reject {
  background: var(--danger-soft);
  border-color: rgb(var(--danger-rgb) / 0.3);
  color: var(--danger-text);
}
.muted { color: var(--text-muted); }
.empty {
  text-align: center;
  padding: 38px 16px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 13px;
}
.empty::before {
  content: '// ';
  color: var(--blue-dim);
}

/* ==================== FORM & MODAL ==================== */
.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgb(var(--overlay-rgb) / 0.82);
  overscroll-behavior: contain;
}
.modalbox {
  width: min(800px, 100%);
  max-height: min(90vh, 90dvh);
  overflow-y: auto;
  background: var(--bg-card);
  border: 1px solid rgb(var(--accent-rgb) / 0.3);
  border-radius: var(--radius-lg);
  box-shadow: 0 20px 60px rgb(var(--shadow-rgb) / .5);
  padding: 0;
}
.modalhead {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  background: var(--surface-inset);
  border-bottom: 1px solid var(--border);
}
.modalhead h3 {
  min-width: 0;
  flex: 1;
  overflow-wrap: anywhere;
  margin: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--blue-bright);
  display: flex;
  align-items: center;
  gap: 8px;
}
.modalhead h3::before {
  content: '>';
  color: var(--blue);
  font-weight: bold;
}
.close {
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 18px;
  cursor: pointer;
  line-height: 1;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  transition: all 0.15s ease;
}
.close:hover {
  background: rgb(var(--danger-rgb) / 0.15);
  border-color: rgb(var(--danger-rgb) / 0.4);
  color: var(--danger-text);
}
.modal-body {
  padding: 20px 24px 26px;
}
.node-share-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 0 auto 20px;
  text-align: center;
}
.node-share-qr {
  width: min(320px, 100%);
  aspect-ratio: 1;
  display: block;
  box-sizing: border-box;
  padding: 14px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 12px 36px rgb(var(--shadow-rgb) / 0.35);
}
.node-share-meta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  overflow-wrap: anywhere;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 14px;
}
.span2 {
  grid-column: 1 / -1;
}
.note {
  margin: 12px 0;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: rgb(var(--accent-rgb) / 0.05);
  border-left: 3px solid var(--blue);
  color: var(--text-dim);
  font-size: 12.5px;
  line-height: 1.6;
}
.raw {
  min-height: 60vh;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.5;
  background: var(--surface-inset);

.core-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(85px,1fr)); gap: 8px; margin-top: 18px; max-height: 240px; overflow: auto; }
.core-item { padding: 8px; background: var(--surface-inset); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; font-variant-numeric: tabular-nums; }
.monitor-chart { width: 100%; height: 150px; display: block; margin-top: 18px; }
.monitor-rx { color: var(--blue); } .monitor-tx { color: var(--green); }
.monitor-chart .chart-grid { stroke: var(--border); stroke-width: 1; }
.monitor-chart .rx-line { fill: none; stroke: var(--blue); stroke-width: 2; vector-effect: non-scaling-stroke; }
.monitor-chart .tx-line { fill: none; stroke: var(--green); stroke-width: 2; vector-effect: non-scaling-stroke; }
.preview-result { margin-top: 16px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-inset); }
.preview-result pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow: auto; font: 12px/1.7 var(--font-mono); }
html:not([data-theme="high"]) .error::before { content: none; }
@media (max-width: 1100px) { .monitor-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } .monitor-details { grid-template-columns: 1fr; } }
@media (max-width: 430px) { .monitor-grid { grid-template-columns: 1fr; } .metric-value { font-size: 26px; } }

/* ==================== RESPONSIVE ==================== */
@media (max-width: 960px) {
  .cards { grid-template-columns: repeat(2, 1fr); }
  .main { padding: 20px; }
}
@media (max-width: 768px) {
  .theme-options { grid-template-columns: 1fr; }
  .usage-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .backup { flex-wrap: wrap; }
  .side {
    width: 64px;
    padding: 14px 6px;
  }
  .side-brand {
    padding: 0 0 14px;
    justify-content: center;
  }
  .side-brand div:last-child, .nav span, .nav-section-title, .side-status span {
    display: none;
  }
  .side-status {
    justify-content: center;
    padding: 10px 0;
  }
  .nav {
    justify-content: center;
    padding: 10px 0;
  }
  .main { padding: 16px 12px; }
  .top {
    flex-direction: column;
    align-items: flex-start;
  }
  .top-title-area { flex: none; }
  .actions { width: 100%; flex: none; justify-content: flex-start; }
  .actions .btn, .actions select { flex: 1; }
  .cards { grid-template-columns: 1fr 1fr; }
  .grid { grid-template-columns: 1fr; }
  .span2 { grid-column: auto; }
  .checks { grid-template-columns: 1fr; }
  .subscription-row { grid-template-columns: 1fr; }
  .subscription-actions { justify-content: flex-start; }
  .subscription-qr-button { width: 112px; }
}
@media (max-width: 600px) {
  .app { display: block; }
  .side {
    position: sticky;
    z-index: 20;
    top: 0;
    width: 100%;
    height: auto;
    padding: 10px 12px 6px;
    border-right: 0;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 8px 20px rgb(var(--shadow-rgb) / .25);
  }
  .side-brand { justify-content: flex-start; padding: 0 2px 9px; margin-bottom: 6px; }
  .side-brand div:last-child, .nav span { display: block; }
  .side-brand p, .side-status, .nav-section-title { display: none; }
  .nav-group { display: flex; flex: none; gap: 5px; overflow-x: auto; padding-bottom: 4px; }
  .nav { width: auto; flex: 0 0 auto; min-height: 40px; padding: 8px 10px; font-size: 12px; }
  .nav i { width: auto; }
  .top { margin-bottom: 18px; }
  .top h2 { font-size: 20px; }
  .actions { gap: 7px; }
  .actions select { flex: 1 1 100%; }
  .actions .btn { flex: 1 1 auto; }
  .current-profile { flex: 1 1 100% !important; max-width: 100%; }
  .current-profile strong { max-width: min(220px, 55vw); }
  .panel { padding: 16px; }
  .modal { padding: 10px; }
  .modalbox { max-height: min(96vh, 96dvh); }
  .modal-body { padding: 16px; }
  .modalhead .window-dots { display: none; }
  .toast { left: 12px; right: 12px; bottom: 12px; }
}
@media (max-width: 400px) {
  .cards { gap: 8px; }
  .card { padding: 13px; }
  .card b { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.host-overview-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin-bottom:18px; }
.host-card { display:flex; flex-direction:column; text-align:left; gap:14px; min-width:0; padding:22px; color:var(--text); background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; font:inherit; }
.host-card:hover,.host-card:focus-visible { border-color:var(--blue); outline:2px solid transparent; }
.host-card-heading { display:flex; align-items:center; gap:10px; }

.host-address { display:block; color:var(--text-muted); font-size:12px; line-height:1.7; overflow-wrap:anywhere; }
.host-summary { display:flex; flex-direction:column; gap:16px; }

.host-detail-title { margin:18px 0 8px; }
.sni-field { display:flex; gap:12px; align-items:center; }

#remoteNodeForm>.grid { gap:22px 20px; }

#remoteNodeForm textarea { min-height:110px; }
.sni-dialog { width:min(760px,calc(100vw - 32px)); max-height:calc(100dvh - 40px); padding:0; color:var(--text); background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:0 24px 80px rgb(0 0 0 / .3); }
.sni-dialog::backdrop { background:rgb(0 0 0 / .5); }
.sni-dialog-head,.sni-dialog-foot { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:20px 24px; }
.sni-dialog-head { border-bottom:1px solid var(--border); }
.sni-dialog-head h3 { display:flex; align-items:center; gap:10px; margin:0 0 8px; }
.sni-dialog-body { padding:20px 24px; overflow-y:auto; max-height:calc(100dvh - 280px); }
.sni-dialog-body details { margin-bottom:20px; }
.sni-dialog-body summary { cursor:pointer; color:var(--text-muted); margin-bottom:12px; }
.sni-dialog-body progress { width:100%; height:6px; accent-color:var(--blue); }
.sni-dialog-body .panel-head { flex-wrap:wrap; }
#sniProgress { min-width:0; overflow-wrap:anywhere; flex:1; }
.sni-results { display:flex; flex-direction:column; margin-top:20px; }
.sni-result { display:grid; grid-template-columns:minmax(0,1fr) 90px auto; gap:16px; padding:15px 0; border-bottom:1px solid var(--border); align-items:center; }
.sni-result strong { display:block; overflow-wrap:anywhere; font-size:13px; }
.sni-result small { display:block; color:var(--text-muted); font-size:11px; margin-top:6px; overflow-wrap:anywhere; }
.sni-latency { color:var(--blue-bright); font-variant-numeric:tabular-nums; font-size:13px; }
.sni-dialog-foot { border-top:1px solid var(--border); }
@media(max-width:1100px) { .host-overview-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(max-width:600px) { .host-overview-grid { grid-template-columns:1fr; } .sni-field { flex-direction:column; align-items:stretch; } .sni-result { gap:8px; grid-template-columns:minmax(0,1fr) 66px auto; } .sni-dialog-head,.sni-dialog-body,.sni-dialog-foot { padding:16px; } }

      <button class="nav" type="button" data-page="servers" title="服务器管理"><i aria-hidden="true"><svg class="icon"><use href="#icon-server"/></svg></i><span>服务器管理</span></button>
      <button class="nav" type="button" data-page="nodes" title="节点管理"><i aria-hidden="true"><svg class="icon"><use href="#icon-network"/></svg></i><span>节点管理</span></button>
      <button class="nav" type="button" data-page="settings" title="设置"><i aria-hidden="true"><svg class="icon"><use href="#icon-palette"/></svg></i><span>设置</span></button>
    </div>
    <div class="side-status">
      <span class="status-indicator"></span>
      <span>控制台已就绪</span>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div class="top-title-area">
        <div class="cli-breadcrumb">MXIOC <span>/ 工作空间 / </span><span id="titleBreadcrumb">overview</span></div>
        <h2 id="title">总览</h2>
        <p id="subtitle">综合订阅配置状态</p>
      </div>
      <div class="actions">
        <button id="manageProfiles" class="btn current-profile" title="进入订阅管理并切换配置"><span>当前订阅</span><strong id="currentProfileName">—</strong><span>切换 <svg class="icon" aria-hidden="true"><use href="#icon-chevron-right"/></svg></span></button>
        <button id="refresh" class="btn"><svg class="icon" aria-hidden="true"><use href="#icon-refresh-cw"/></svg>刷新</button>
        <button id="importNode" class="btn hidden"><svg class="icon" aria-hidden="true"><use href="#icon-link"/></svg>批量链接导入</button>
        <button id="add" class="btn primary hidden"><svg class="icon" aria-hidden="true"><use href="#icon-circle-plus"/></svg>新增</button>
        <button id="logout" class="btn danger"><svg class="icon" aria-hidden="true"><use href="#icon-log-out"/></svg>退出</button>
      </div>
    </div>
    <nav id="sectionTabs" class="toolbar" aria-label="当前功能分区" style="margin-bottom:16px;gap:8px;flex-wrap:wrap"></nav>
    <div id="content"></div>
  </main>
</div>

<!-- MODAL DIALOG -->
<div id="modal" class="modal hidden">
  <div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <div class="modalhead">
      <div class="window-dots">
        <span class="window-dot dot-red"></span>
        <span class="window-dot dot-yellow"></span>
        <span class="window-dot dot-green"></span>
      </div>
      <h3 id="modalTitle"></h3>
      <button id="modalClose" class="close" title="关闭 (ESC)"><svg class="icon" aria-hidden="true"><use href="#icon-x"/></svg></button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<!-- TOAST ALERT -->
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = {
  token: sessionStorage.getItem('mxioc_token') || localStorage.getItem('mxioc_token'),
  page: 'overview',
  data: null,
  profiles: [],
  profile: localStorage.getItem('mxioc_profile') || 'clash',
  nodeSelection: new Set(),
  filters: {},
  tablePages: {},
  ruleAction: '',
  profileFilter: 'all',
  profileSort: 'default',
  servers: [],
  serverId: '',
  remoteRows: [],
  updatePrompted: ''
};

function notice(text) {
  const t = $('toast');
  t.innerHTML = uiIcon('check') + esc(text);
  t.classList.remove('hidden');
  clearTimeout(window._noticeTimer);
  window._noticeTimer = setTimeout(() => t.classList.add('hidden'), 2400);
}

function showLogin() {
  stopMonitoring();
  S.monitorHistory = new Map(); S.monitorData = null; S.monitorId = '';
  S.monitorCards = new Map(); closeSniScanner();
  sessionStorage.removeItem('mxioc_token');
  localStorage.removeItem('mxioc_token');
  S.token = null;
  S.data = null;
  S.profiles = [];
  S.servers = [];
  S.remoteRows = [];
  S.remoteLoaded = false;
  S.remoteServer = null;
  S.serverId = '';
  S.jobView = null;
  S.nodeSelection.clear();
  S.filters = {};
  S.tablePages = {};
  S.ruleAction = '';
  $('content').replaceChildren();
  $('modal').classList.add('hidden');
  $('modalBody').replaceChildren();
  document.body.classList.remove('modal-open');
  S.modalFocus = null;
  $('boot').classList.add('hidden');
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('user').focus();
}

async function showAuthenticatedApp() {
  await loadProfiles();
  await reload(false);
  await go('overview');
  $('boot').classList.add('hidden');
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  void checkUpdateNotice();
}

async function bootstrap() {
  $('boot').classList.remove('hidden', 'failed');
  $('bootStatus').textContent = '正在验证登录状态…';
  $('bootRetry').classList.add('hidden');
  try {
    await showAuthenticatedApp();
  } catch (error) {
    if (!$('login').classList.contains('hidden')) return;
    $('boot').classList.add('failed');
    $('bootStatus').textContent = '加载失败：' + error.message;
    $('bootRetry').classList.remove('hidden');
  }
}

async function logout(remote = true) {
  if (remote) {
    try { await fetch('/admin/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch (_) {}
  }
  showLogin();
}

async function api(path, opt = {}) {
  opt.headers = { 'X-Profile': S.profile, ...(opt.headers || {}) };
  if (S.token) opt.headers.Authorization = 'Bearer ' + S.token;
  opt.credentials = 'same-origin';
  let r = await fetch('/admin/api' + path, opt);
  let d = await r.json().catch(() => ({}));
  if (r.status === 401) {
    showLogin();
    throw Error(d.error || '登录已失效');
  }
  if (!r.ok) throw Error(d.error || '请求失败');
  return d;
}

const jsonOpt = (method, body) => ({
  method,
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(body)
});

const shortSha = value => value ? String(value).slice(0, 12) : '未记录';
const updateTime = value => value ? new Date(value * 1000).toLocaleString() : '尚未检查';

function updatePanel(status) {
  let state = status.updating ? '正在安装更新' : status.available ? '发现新版本' : status.checkError ? '检查失败' : '当前已是最新版本';
  return `
    <section class="panel">
      <div class="panel-head">
      <h3>程序更新</h3>
        <span class="pill">${esc(state)}</span>
      </div>
      <div class="grid">
        <div><label>当前版本</label><code>${esc(shortSha(status.currentSha))}</code></div>
        <div><label>仓库最新版本</label><code>${esc(shortSha(status.latestSha))}</code></div>
        <div><label>最近检查</label><span>${esc(updateTime(status.checkedAt))}</span></div>
        <div><label>更新说明</label><span>${esc(status.latestMessage || '暂无')}</span></div>
      </div>
      ${status.checkError ? `<div class="error">${esc(status.checkError)}</div>` : ''}
      <div class="toolbar" style="margin-top:16px;">
        <button class="btn" onclick="manualUpdateCheck()">${uiIcon('refresh-cw')}立即检查</button>
        ${status.available ? '<button class="btn primary" onclick="confirmSoftwareUpdate(false)">⬆ 立即升级</button><button class="btn" onclick="dismissSoftwareUpdate()">暂不更新</button>' : '<button class="btn" onclick="confirmSoftwareUpdate(true)">↻ 重新安装当前版本</button>'}
      </div>
      <div class="note">系统每 24 小时自动检查一次 GitHub 仓库。只有点击“立即更新”才会安装；更新程序不会修改现有订阅、节点、规则、域名或证书。</div>
    </section>`;
}

function showUpdatePrompt(status) {
  S.updatePrompted = status.latestSha;
  openModal('SOFTWARE_UPDATE // 发现项目更新', `
    <div class="note">检测到 GitHub 仓库有新版本。更新只替换后台程序和内置模板，不会覆盖现有订阅配置。</div>
    <div class="grid" style="margin-top:16px;">
      <div><label>当前版本</label><code>${esc(shortSha(status.currentSha))}</code></div>
      <div><label>最新版本</label><code>${esc(shortSha(status.latestSha))}</code></div>
      <div class="span2"><label>更新说明</label><b>${esc(status.latestMessage || '仓库代码已更新')}</b></div>
    </div>
    <div class="toolbar" style="margin-top:18px;">
      <button class="btn primary" onclick="confirmSoftwareUpdate()">⬆ 立即更新</button>
      <button class="btn" onclick="dismissSoftwareUpdate()">暂不更新此版本</button>
    </div>`);
}

async function checkUpdateNotice(force = false) {
  try {
    let status = force
      ? await api('/updates/check', jsonOpt('POST', {}))
      : await api('/updates');
    if (status.available && !status.updating && S.updatePrompted !== status.latestSha) showUpdatePrompt(status);
    return status;
  } catch (_) {
    return null;
  }
}

async function manualUpdateCheck() {
  let status = await checkUpdateNotice(true);
  if (!status) return alert('暂时无法连接仓库检查更新');
  if (!status.available) notice(status.checkError ? '检查失败，请稍后重试' : '当前已经是最新版本');
  if (S.page === 'maintenance') maintenance();
}

async function dismissSoftwareUpdate() {
  try {
    await api('/updates/dismiss', jsonOpt('POST', {}));
    closeModal();
    notice('已忽略本次版本；仓库出现下一次更新时会再次提醒');
    if (S.page === 'maintenance') maintenance();
  } catch (error) {
    alert(error.message);
  }
}

async function confirmSoftwareUpdate(force = false) {
  if (!confirm(force ? '确认重新安装当前版本？现有用户数据都会保留。' : '确认安装仓库最新版本？现有订阅、节点、规则、域名和证书都会保留。')) return;
  try {
    let result = await api('/updates/apply', jsonOpt('POST', { force }));
    let target = result.task.sha;
    closeModal();
    notice('更新任务已启动，后台会自动重启……');
    for (let i = 0; i < 300; i++) {
      await new Promise(resolve => setTimeout(resolve, 2000));
      try {
        let status = await api('/updates');
        if (status.currentSha === target && !status.updating) {
          location.reload();
          return;
        }
        if (!status.updating && status.lastResult?.ok === false) throw Error(status.lastResult.error || '更新失败');
      } catch (error) {
        if (error.message.includes('更新失败')) throw error;
      }
    }
    alert('更新仍在后台执行，请稍后刷新页面查看版本状态');
  } catch (error) {
    alert(error.message);
  }
}

async function loadProfiles() {
  let d = await api('/profiles');
  S.profiles = d.profiles;
  if (!S.profiles.some(x => x.id === S.profile)) {
    S.profile = S.profiles[0]?.id || 'clash';
    S.data = null;
    S.nodeSelection.clear();
    S.filters = {profiles:S.filters.profiles || ''};
    S.tablePages = {profiles:S.tablePages.profiles || 1};
    S.ruleAction = '';
  }
  localStorage.setItem('mxioc_profile', S.profile);
  $('currentProfileName').textContent = S.profiles.find(x => x.id === S.profile)?.name || '未选择订阅';
}

async function reload(render = true) {
  const profile = S.profile;
  const data = await api('/snapshot');
  if (S.profile !== profile) return;
  S.data = data;
  let existing = new Set(S.data.nodes.map(node => node.name));
  S.nodeSelection = new Set([...S.nodeSelection].filter(name => existing.has(name)));
  if (render) draw();
}

const pageInfo = {
  overview: ['总览', '综合订阅配置状态与核心运行指标'],
  profiles: ['订阅管理', '搜索、切换和管理所有订阅配置与分享链接'],
  servers: ['服务器管理', '通过 SSH 选择安装 3x-ui、Xray 或 sing-box'],
  monitoring: ['硬件监控', '查看已登记服务器的 CPU、内存、磁盘和实时网速'],
  serverNodes: ['服务器节点', '管理面板与独立内核的入站、中转和节点分享链接'],
  nodes: ['节点管理', '节点的新增、修改、删除与策略组同步'],
  chains: ['链式代理', '选择入口和出口节点组成两跳中继代理链路'],
  groups: ['策略组管理', '管理业务分组、节点列表和自动选择顺序'],
  rules: ['路由规则', '管理直连、代理、拒绝及业务分组规则'],
  dns: ['DNS 分流', '按域名规则指定国内阿里/腾讯或海外加密 DNS'],
  subscriptions: ['订阅工具', '批量解析订阅链接并生成多格式转换分享'],
  traffic: ['流量与到期', '按订阅管理流量额度、已用量与有效期，统一同步至三个客户端'],
  raw: ['原始配置', '直接编辑并校验底层 Clash / Mihomo YAML'],
  system: ['账号与安全', '修改管理员用户名、密码以及查看历史配置备份'],
  settings: ['设置', '选择适合当前设备的界面主题'],
  maintenance: ['升级与卸载', '检查升级、重新安装或安全卸载管理后台']
};

const pageSections = {
  overview: ['overview'],
  profiles: ['profiles', 'traffic', 'subscriptions'],
  servers: ['servers', 'monitoring', 'serverNodes'],
  nodes: ['nodes', 'chains', 'groups', 'rules', 'dns', 'raw'],
  settings: ['settings', 'system', 'maintenance']
};
const sectionFor = page => Object.keys(pageSections).find(key => pageSections[key].includes(page)) || 'overview';

async function go(page) {
  if (page !== 'monitoring') stopMonitoring();
  if (S.page !== page) $('content').innerHTML = '<div class="empty" role="status">正在加载…</div>';
  S.page = page;
  const section = sectionFor(page);
  $('sectionTabs').innerHTML = pageSections[section].filter(p => p !== 'serverNodes' || S.serverId).map(p =>
    `<button type="button" data-page="${p}" class="btn small ${p === page ? 'primary' : ''}" ${p === page ? 'aria-current="page"' : ''} onclick="${p === 'monitoring' ? "S.monitorId='';" : ''}go('${p}').catch(error=>notice(error.message))">${esc(pageInfo[p][0])}</button>`).join('');
  $('sectionTabs').classList.toggle('hidden', pageSections[section].length === 1);
  document.querySelectorAll('.nav').forEach(n => {
    n.classList.toggle('active', n.dataset.page === section);
    if (n.dataset.page === section) n.setAttribute('aria-current', 'page');
    else n.removeAttribute('aria-current');
  });
  if (matchMedia('(max-width: 600px)').matches) {
    const active = document.querySelector('.nav[aria-current="page"]'), group = document.querySelector('.nav-group');
    if (active && group) group.scrollLeft = Math.max(0, active.offsetLeft - group.offsetLeft - (group.clientWidth - active.clientWidth) / 2);
  }
  $('title').textContent = pageInfo[page][0];
  $('subtitle').textContent = pageInfo[page][1];
  $('titleBreadcrumb').textContent = page;
  $('add').classList.toggle('hidden', !['nodes', 'chains', 'groups', 'rules', 'dns'].includes(page));
  $('importNode').classList.toggle('hidden', page !== 'nodes');
  if (!S.profiles.length) await loadProfiles();
  if (!S.data && !['profiles', 'settings', 'system', 'maintenance', 'servers', 'serverNodes', 'monitoring'].includes(page)) await reload(false);
  if (S.page !== page) return;
  draw();
}

function draw() {
  const page = S.page, profile = S.profile;
  const failed = error => {
    if (S.page !== page || S.profile !== profile || !$('login').classList.contains('hidden')) return;
    $('content').innerHTML = `<section class="panel"><h3>页面加载失败</h3><p class="muted">${esc(error.message)}</p><button class="btn" onclick="draw()">重试</button></section>`;
  };
  try {
    Promise.resolve(({ overview, profiles, servers, serverNodes, monitoring, nodes, chains, groups, rules, dns, subscriptions, traffic, raw, system, settings, maintenance }[page] || overview)()).catch(failed);
  } catch (error) { failed(error); }
}

function tableSlice(rows, key) {
  const size = key === 'monitoring' ? 18 : 50;
  const pages = Math.max(1, Math.ceil(rows.length / size));
  const page = Math.min(pages, Math.max(1, S.tablePages[key] || 1));
  S.tablePages[key] = page;
  return { rows: rows.slice((page - 1) * size, page * size), count: rows.length, page, pages, key, size };
}

function pagination(p) {
  return `<div class="pagination"><span>共 ${p.count} 项 · 每页 ${p.size || 50} 项</span><div class="toolbar">
    <button class="btn small" onclick="turnTablePage('${p.key}',-1)" ${p.page === 1 ? 'disabled' : ''}>上一页</button>
    <span>${p.page} / ${p.pages}</span>
    <button class="btn small" onclick="turnTablePage('${p.key}',1)" ${p.page === p.pages ? 'disabled' : ''}>下一页</button>
  </div></div>`;
}

function turnTablePage(key, delta) {
  S.tablePages[key] = (S.tablePages[key] || 1) + delta;
  draw();
}

function bindSearch(key, render) {
  $('search').oninput = e => {
    S.filters[key] = e.target.value;
    S.tablePages[key] = 1;
    const page = S.page, profile = S.profile;
    clearTimeout(window._searchTimer);
    window._searchTimer = setTimeout(() => {
      if (S.page !== page || S.profile !== profile) return;
      const focused = document.activeElement === $('search');
      const start = $('search').selectionStart, end = $('search').selectionEnd;
      render();
      if (focused) { $('search').focus(); $('search').setSelectionRange(start, end); }
    }, 120);
  };
}

function formatBytes(value) {
  if (value == null) return '不限';
  const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB', 'PiB'];
  const index = value > 0 ? Math.min(5, Math.floor(Math.log(value) / Math.log(1024))) : 0;
  return (value / 1024 ** index).toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + ' ' + units[index];
}

function setTheme(theme) {
  if (!['high', 'low', 'pink'].includes(theme)) return;
  const root = document.documentElement;
  root.classList.add('theme-switching');
  root.dataset.theme = theme;
  // Apply all palette changes in one frame instead of interpolating through the previous theme.
  void root.offsetWidth;
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('theme-switching')));
  let persisted = true;
  try { localStorage.setItem('mxioc_theme', theme); } catch (_) { persisted = false; }
  document.querySelectorAll('[data-theme-choice]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.themeChoice === theme)));
  notice(persisted ? `已切换为${({high:'科技', low:'简洁', pink:'猛男'})[theme]}主题` : '主题已切换，当前浏览器未允许保存偏好');
}

function settings() {
  const theme = document.documentElement.dataset.theme;
  $('content').innerHTML = `<section class="panel"><div class="panel-head"><h3>外观与性能</h3><span class="pill">当前设备</span></div>
    <p class="muted">首次使用默认科技主题。选择会保存在当前浏览器，不影响其他设备；切换立即生效。</p>
    <div class="theme-options">
      <button type="button" class="theme-option" data-theme-choice="high" aria-pressed="${theme === 'high'}" onclick="setTheme('high')">
        <span class="theme-preview high" aria-hidden="true"></span><strong>科技主题 · 终端工作台</strong><p>恢复原来的网格背景、蓝色光晕、终端字体和磨砂弹窗。适合性能较好的设备。</p>
      </button>
      <button type="button" class="theme-option" data-theme-choice="low" aria-pressed="${theme === 'low'}" onclick="setTheme('low')">
        <span class="theme-preview low" aria-hidden="true"></span><strong>简洁主题 · 轻量界面</strong><p>保留当前简洁界面，减少阴影和动画，关闭背景模糊。适合手机、旧电脑与省电场景。</p>
      </button>
      <button type="button" class="theme-option" data-theme-choice="pink" aria-pressed="${theme === 'pink'}" onclick="setTheme('pink')">
        <span class="theme-preview pink" aria-hidden="true"></span><strong>猛男主题 · 温柔粉色</strong><p>暖粉底色、柔和边框与舒展留白，搭配衬线标题和圆角组件，让复杂配置也从容清晰。</p>
      </button>
    </div><div class="note">三套主题拥有相同的功能和分页优化。所有组件使用当前主题的统一设计变量。系统开启“减少动态效果”时，科技主题也会降低动画。图标来自 Lucide（ISC），已本地嵌入。</div>
  </section>`;
}

function profiles() {
  const q = S.filters.profiles || '';
  let rows = S.profiles.filter(p => `${p.name} ${p.id}`.toLowerCase().includes(q.toLowerCase()));
  if (S.profileFilter === 'current') rows = rows.filter(p => p.id === S.profile);
  if (S.profileFilter === 'configured') rows = rows.filter(p => p.traffic?.configured);
  if (S.profileFilter === 'expired') rows = rows.filter(p => p.traffic?.expired);
  if (S.profileSort === 'name') rows.sort((a,b) => a.name.localeCompare(b.name, 'zh-CN', {numeric:true}));
  if (S.profileSort === 'latest') rows.reverse();
  const page = tableSlice(rows, 'profiles');
  const current = S.profiles.find(p => p.id === S.profile);
  $('content').innerHTML = `<section class="panel"><div class="panel-head"><div class="profile-summary"><h3>我的订阅</h3><p class="muted">共 ${S.profiles.length} 份订阅 · 当前：${esc(current?.name || '未选择')}</p></div>
    <button class="btn primary" onclick="profileCreate()">${uiIcon('circle-plus')}新建订阅</button></div>
    <div class="toolbar profiles-toolbar"><input id="search" aria-label="搜索订阅" placeholder="搜索订阅名称或标识…" value="${esc(q)}">

        <div class="toolbar profile-actions"><button class="btn small" onclick="profileEdit('${id}')">重命名 / 设置</button><button class="btn small" onclick="profileDuplicate('${id}')">复制为新订阅</button>

      </article>`;

  $('profileFilter').value = S.profileFilter;
  $('profileSort').value = S.profileSort;
  $('profileFilter').onchange = e => { S.profileFilter = e.target.value; S.tablePages.profiles = 1; profiles(); };
  $('profileSort').onchange = e => { S.profileSort = e.target.value; S.tablePages.profiles = 1; profiles(); };
  bindSearch('profiles', profiles);
}

async function useProfile(encoded, page = 'nodes') {
  const id = decodeURIComponent(encoded), profile = S.profiles.find(p => p.id === id);
  if (!profile) return notice('该订阅已不存在，请刷新列表');
  try {
    if (S.profile !== id) {
      S.profile = id;
      localStorage.setItem('mxioc_profile', id);
      S.nodeSelection.clear();
      S.data = null;
      S.filters = {profiles:S.filters.profiles || ''};
      S.tablePages = {profiles:S.tablePages.profiles || 1};
      S.ruleAction = '';
    }
    $('currentProfileName').textContent = profile.name;
    closeModal();
    if (!S.data) await reload(false);
    if (S.profile !== id) return;
    await go(page);
    notice('当前订阅：' + profile.name);
  } catch (error) { notice('切换失败：' + error.message); }
}

function profileCopyLink(encoded) {
  const p = S.profiles.find(x => x.id === decodeURIComponent(encoded));
  if (p) copyText(location.origin + p.url);
}

async function profileClientLinks(encoded) {
  const p = S.profiles.find(x => x.id === decodeURIComponent(encoded));
  if (!p) return;
  openModal('客户端订阅 · ' + p.name, `<p class="muted">电脑选 v2rayN，安卓选 v2rayNG，iPhone 选 Shadowrocket。普通节点订阅不携带主备策略；自动切换请选择专用配置。用量与有效期按整个订阅统计，更新订阅后刷新。</p>
    ${subscriptionRow('Clash / Mihomo', '完整节点、策略组、规则与 DNS', location.origin + p.url, p.url)}
    <div id="clientConversionRows" class="empty">正在检查客户端兼容性...</div>`);
  const target = $('clientConversionRows');
  try {
    const result = await api('/conversions', {headers: {'X-Profile': p.id}});
    if (target?.isConnected) { target.classList.remove('empty'); target.innerHTML = conversionRows(result.formats || []); }
  } catch (err) { if (target?.isConnected) target.textContent = err.message; }
}

function profileDuplicate(encoded) { profileCreate(decodeURIComponent(encoded)); }

const panelType = value => ['3x-ui', 'x-ui', 'x-panel'].includes(value || '3x-ui');
const remoteStage = stage => ({connecting:'连接 SSH',preflight:'检查安装环境',download:'下载脚本',install:'安装所选软件',config:'校验内核配置',credentials:'设置管理凭证',service:'启动服务',installed:'检查安装', 'api-check':'验证登录与接口',diagnostics:'读取失败诊断',complete:'安装完成'}[stage] || stage || '未开始');
const remoteStatus = status => ({running:'安装中',succeeded:'已安装',failed:'安装失败',interrupted:'任务已中断'}[status] || '待连接');

function panelLink(value) {
  try { const url = new URL(value); return ['https:', 'http:'].includes(url.protocol) ? url.href : ''; } catch (_) { return ''; }
}

async function servers() {
  if (S.servers.length) renderServers();
  const data = await api('/servers');
  if (S.page !== 'servers') return;
  S.servers = data.servers;
  renderServers();
}

    <div class="toolbar profiles-toolbar"><input id="search" aria-label="搜索服务器" placeholder="搜索名称、IP 或域名…" value="${esc(q)}"></div>
    <div class="profile-grid">${page.rows.map(s => {
      const id = encodeURIComponent(s.id), url = panelLink(s.panelUrl), running = s.job?.status === 'running';
      return `<article class="profile-card"><div class="profile-card-head"><div><h4>${esc(s.name)}</h4><div class="profile-id">${esc(s.sshUser)}@${esc(s.host)}:${s.sshPort}</div></div><span class="pill ${s.job?.status === 'failed' ? 'reject' : ''}">${s.connectionMode === 'existing' ? (s.existingVerifiedAt ? '已接入' : '待验证') : remoteStatus(s.job?.status)}</span></div>

      ${s.lastError ? `<div class="error">${esc(s.lastError)}</div>` : ''}
      ${url ? `<a class="btn small" href="${esc(url)}" target="_blank" rel="noopener noreferrer">打开面板 ${uiIcon('chevron-right')}</a><code style="overflow-wrap:anywhere;white-space:normal">${esc(url)}</code>` : ''}
      <div class="toolbar"><button class="btn small primary" onclick="openRemoteNodes('${id}')" ${running ? 'disabled' : ''}>节点 / 中转</button><button class="btn small" onclick="serverForm('${id}')" ${running ? 'disabled' : ''}>连接设置</button><button class="btn small" onclick="openHostMonitor('${id}')">硬件监控</button><button class="btn small" onclick="serverTest('${id}',this)">测试 SSH</button></div>
      <div class="toolbar profile-actions">${s.connectionMode === 'existing' ? `<button class="btn small" onclick="serverAttach('${id}',this)">${panelType(s.installType) ? '验证现有面板' : '验证已有内核'}</button>` : `<button class="btn small" onclick="serverInstall('${id}')" ${running ? 'disabled' : ''}>${s.job?.status === 'failed' || s.job?.status === 'interrupted' ? '重新安装 / 重试' : '安装 / 更新'}</button>`}
      ${s.job ? `<button class="btn small" onclick="showServerJob('${encodeURIComponent(s.job.id)}')">安装日志</button>` : ''}
      <button class="btn small" onclick="serverDiagnose('${id}')">读取诊断</button><button class="btn small danger" onclick="serverRemove('${id}')" ${running ? 'disabled' : ''}>移除管理</button></div></article>`;
    }).join('') || '<div class="empty">尚未添加服务器，或没有匹配结果。</div>'}</div>${pagination(page)}</section>`;

}

function serverForm(encoded = '', existing = false) {

  openModal(s.id ? '服务器连接设置' : existing ? '接入已有面板 / 内核' : '添加服务器', `<form id="serverForm"><div class="grid">
    <div><label for="rsName">服务器名称</label><input id="rsName" required maxlength="80" value="${esc(s.name || '')}" placeholder="例如 香港入口"></div>

    <div class="span2"><div class="toolbar"><button id="rsProbe" type="button" class="btn">检测 SSH 主机指纹</button><code id="rsFingerprint" style="overflow-wrap:anywhere;white-space:normal">${esc(s.fingerprint || '尚未检测')}</code></div>
    <label class="inlinecheck"><input id="rsTrust" type="checkbox" ${s.fingerprint ? 'checked' : ''} required>我已核对该 SSH 指纹属于目标服务器</label></div>
    <div class="span2"><label for="rsInstallType">${existing ? '已有软件类型' : '安装类型'}</label><select id="rsInstallType" ><option value="3x-ui">3x-ui 面板（含 Xray，支持节点 / 中转）</option>${existing ? '<option value="x-ui">现有 X-ui</option><option value="x-panel">现有 X-Panel（xeefei/X-Panel）</option>' : ''}<option value="xray">独立 Xray 内核</option><option value="sing-box">独立 sing-box 内核</option></select></div>
    <div id="rsCoreBox" class="span2 hidden"><label for="rsCoreConfig">内核 JSON 配置（可选）</label><textarea id="rsCoreConfig" spellcheck="false" placeholder='{"inbounds": [], "outbounds": []}'></textarea><p class="hint">配置加密保存且不回显。留空保留已有配置；首次安装使用官方默认配置，不会自动创建可用节点。填写完整配置后，远端校验通过才会应用，服务启动失败会尝试恢复原配置。独立内核要求 systemd，域名及 TLS 在 JSON 中配置。${s.hasCoreConfig ? '已保存配置；留空会在安装时继续使用该配置。' : ''}</p><label class="inlinecheck"><input id="rsClearCoreConfig" type="checkbox">清除本面板保存的配置，下次安装保留远端配置</label></div>
    <div><label for="rsMode">${existing ? '现有面板访问方式' : '安装模式'}</label><select id="rsMode"><option value="auto">${existing ? '通过 SSH 自动读取面板地址' : '无域名：自动安装'}</option><option value="${existing ? 'url' : 'domain'}">${existing ? '填写已有面板完整地址' : '绑定域名并申请证书'}</option></select></div>
    <div id="rsDomainBox"><label for="rsDomain">绑定域名</label><input id="rsDomain" value="${esc(s.domain || '')}" placeholder="panel.example.com"></div>
    <div id="rsPanelAddressBox" class="span2 hidden"><label for="rsPanelAddress">已有面板完整地址</label><input id="rsPanelAddress" type="url" maxlength="2048" value="${esc(s.panelAddress || '')}" placeholder="https://panel.example.com:13145/riben/"><p class="hint">直接粘贴已有面板的登录地址，包含 http/https、端口和访问路径，不含账号密码或查询参数。API 经 SSH 连接该服务器本机的对应端口；若域名经过 CDN 或异机反代，应选择自动读取或填写这台服务器可用的原站地址。</p></div>
    <div><label id="rsPanelUserLabel" for="rsPanelUser">${existing ? '现有 X-ui' : '预设 3x-ui'} 面板账号</label><input id="rsPanelUser" required minlength="${existing ? 1 : 3}" maxlength="64" autocomplete="off" value="${esc(s.panelUser || 'admin')}"></div>
    <div><label id="rsPanelPasswordLabel" for="rsPanelPassword">${existing ? '现有 X-ui' : '预设 3x-ui'} 面板密码${s.id ? '（留空保留）' : ''}</label><input id="rsPanelPassword" type="password" minlength="${existing ? 1 : 12}" autocomplete="new-password" ${s.id ? '' : 'required'}></div>
  </div><div id="rsInstallNote" class="note">${existing ? '填写已有面板完整地址，或通过 SSH 自动读取。填写完整地址时，按该地址的协议、端口和路径，经 SSH 隧道验证面板账号与接口；SSH 同时用于服务器监控和转发管理。接入不安装、不申请证书、不修改面板账号或节点。' : '域名模式需先将域名解析到该服务器，并允许证书验证使用的 80 端口。无域名模式会返回 IP 加随机端口的 HTTP 面板地址；总面板管理接口始终走 SSH 隧道。'}</div>
  <div id="rsError" class="error" role="alert"></div><button id="rsSave" class="btn primary">保存服务器</button></form>`);
  let pin = s.fingerprint || '';
  const form = $('serverForm'), stillOpen = () => $('serverForm') === form && !$('modal').classList.contains('hidden');
  $('rsMode').value = existing ? (s.panelAddress || !s.id ? 'url' : 'auto') : (s.domain ? 'domain' : 'auto');
  const mode = () => {
    const core = !panelType(val('rsInstallType'));
    const bound = !existing && !core && val('rsMode') === 'domain';
    const explicit = existing && !core && val('rsMode') === 'url';
    $('rsDomainBox').classList.toggle('hidden', !bound); $('rsDomain').required = bound; $('rsDomain').disabled = existing || core;
    $('rsPanelAddressBox').classList.toggle('hidden', !explicit); $('rsPanelAddress').required = explicit; $('rsPanelAddress').disabled = !explicit;
  };
  $('rsInstallType').value = s.installType || '3x-ui';
  const panelNote = $('rsInstallNote').textContent;
  const software = () => {
    const core = !panelType($('rsInstallType').value);
    const title = {'3x-ui':'3x-ui','x-ui':'X-ui','x-panel':'X-Panel'}[val('rsInstallType')] || '';
    $('rsPanelUserLabel').textContent = `${existing ? '现有' : '预设'} ${title} 面板账号`;
    $('rsPanelPasswordLabel').textContent = `${existing ? '现有' : '预设'} ${title} 面板密码${s.id ? '（留空保留）' : ''}`;
    $('rsCoreBox').classList.toggle('hidden', !core || existing);
    $('rsInstallNote').textContent = core ? (existing
      ? '通过 SSH 读取已有内核配置，并验证内核与 systemd 服务，不安装、不重启、不修改远端配置。默认位置：Xray /usr/local/bin/xray、/usr/local/etc/xray/config.json；sing-box /usr/bin/sing-box、/etc/sing-box/config.json。验证成功后可创建总控受管节点，原有未受管节点不会自动导入。'
      : '将使用官方安装器安装独立内核，不提供 Web 面板。安装会重启服务，请检查配置中的端口是否与已有软件冲突。可在服务器节点页面创建模板节点和中转。') : panelNote;
    ['rsPanelUser', 'rsPanelPassword', 'rsMode'].forEach(id => {
      $(id).parentElement.classList.toggle('hidden', core);
      $(id).disabled = core;
    });
    $('rsPanelUser').required = !core;
    $('rsPanelPassword').required = !core && !s.id;
    if (core) $('rsMode').value = 'auto';
    $('rsCoreConfig').disabled = $('rsClearCoreConfig').disabled = core && existing;
    mode();
  };
  software(); $('rsInstallType').onchange = software; $('rsMode').onchange = mode;
  ['rsHost','rsPort'].forEach(id => $(id).oninput = () => { pin = ''; $('rsTrust').checked = false; $('rsFingerprint').textContent = '连接地址已变更，请重新检测'; });
  $('rsProbe').onclick = async () => {
    $('rsProbe').disabled = true; $('rsError').textContent = '';
    const host = val('rsHost'), port = val('rsPort');
    try {
      const data = await api('/servers/probe', jsonOpt('POST', {host,sshPort:port}));
      if (!stillOpen()) return;
      if (host !== val('rsHost') || port !== val('rsPort')) return $('rsError').textContent = '连接地址已变化，请重新检测指纹';
      pin = data.fingerprint; $('rsFingerprint').textContent = pin; $('rsTrust').checked = false;
    } catch (error) { if (stillOpen()) $('rsError').textContent = error.message; }
    finally { if (stillOpen()) $('rsProbe').disabled = false; }
  };
  $('serverForm').onsubmit = async e => {
    e.preventDefault();
    if (!pin || !$('rsTrust').checked) return $('rsError').textContent = '请先检测并核对 SSH 主机指纹';
    $('rsSave').disabled = true;
    const payload = {id:s.id, name:val('rsName'),host:val('rsHost'),sshPort:val('rsPort'),sshUser:val('rsUser'),sshPassword:$('rsPassword').value,
      installType:val('rsInstallType'),coreConfig:existing ? '' : $('rsCoreConfig').value,clearCoreConfig:!existing && $('rsClearCoreConfig').checked,fingerprint:pin,domain:existing ? (panelType(val('rsInstallType')) ? s.domain || '' : '') : (val('rsMode') === 'domain' ? val('rsDomain') : ''),panelAddress:existing && panelType(val('rsInstallType')) && val('rsMode') === 'url' ? val('rsPanelAddress') : '',panelUser:val('rsPanelUser'),panelPassword:$('rsPanelPassword').value,connectionMode:existing ? 'existing' : 'install'};
    try {
      const saved = await api('/servers', jsonOpt(s.id ? 'PUT' : 'POST', payload));
      s.id = saved.server.id;
      if (existing) {
        const result = await api('/servers/attach', jsonOpt('POST', {id:s.id}));
        if (stillOpen()) closeModal(); await servers(); notice(result.message);
      } else { if (stillOpen()) closeModal(); await servers(); notice('服务器已保存，可测试连接或发起安装'); }
    } catch (error) { if (stillOpen()) { $('rsError').textContent = error.message; $('rsSave').disabled = false; } else notice(error.message); }
  };
}

async function serverAttach(encoded, button) {
  button.disabled = true;
  try { const result = await api('/servers/attach', jsonOpt('POST', {id:decodeURIComponent(encoded)})); await servers(); notice(result.message); }
  catch (error) { alert(error.message); }
  finally { if (button.isConnected) button.disabled = false; }
}

async function serverTest(encoded, button) {
  button.disabled = true; button.textContent = '测试中…';
  try { const result = await api('/servers/test', jsonOpt('POST', {id:decodeURIComponent(encoded)})); notice(result.message); }
  catch (error) { alert(error.message); }
  finally { if (button.isConnected) { button.disabled = false; button.textContent = '测试 SSH'; } }
}

async function serverInstall(encoded) {
  const id = decodeURIComponent(encoded), s = S.servers.find(x => x.id === id);
  if (!s || !confirm(`将在 ${s.host}:${s.sshPort} 上安装或更新 ${s.installType || '3x-ui'}。${panelType(s.installType) ? '面板账号设为 ' + s.panelUser + '。' : '将校验内核配置并重启服务；此操作不安装 Web 面板。'}${s.domain ? '绑定域名：'+s.domain : '使用无域名自动安装模式'}。确认执行？`)) return;
  try {
    const result = await api('/servers/install', jsonOpt('POST', {id,confirmed:true}));
    await servers(); showServerJob(result.job.id);
  } catch (error) { alert(error.message); }
}

async function showServerJob(jobId) {
  const identity = decodeURIComponent(jobId);
  const view = {};
  S.jobView = view;
  openModal('软件安装进度与日志', '<p id="serverJobState" role="status">正在读取任务…</p><div id="serverJobError" class="error" role="alert"></div><div id="serverJobResult"></div><pre id="serverJobLog" class="server-log"></pre>');
  const poll = async () => {
    if (S.jobView !== view || $('modal').classList.contains('hidden') || !$('serverJobLog')) return;
    try {
      const job = await api('/servers/jobs?id=' + encodeURIComponent(identity));
      if (S.jobView !== view || !$('serverJobLog')) return;
      $('serverJobState').textContent = (job.status === 'running' && job.error ? '安装失败，正在读取诊断' : remoteStatus(job.status)) + ' · ' + remoteStage(job.stage) + (job.exitCode != null ? ' · 退出码 '+job.exitCode : '');
      $('serverJobError').textContent = job.error || '';
      const log = $('serverJobLog'), bottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 50;
      log.textContent = job.log || '等待远端输出…'; if (bottom) log.scrollTop = log.scrollHeight;
      const url = panelLink(job.panelUrl);
      $('serverJobResult').innerHTML = url ? `<p>面板地址：<a class="btn small" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a></p><p class="hint">地址来自远端实际配置。若公网访问失败，请检查云防火墙及该面板端口是否放行。</p>` : '';
      if (job.status === 'running') setTimeout(poll, 2500);
      else if (S.page === 'servers') await servers();

function closeSniScanner() {
  const view=S.sniScan;
  if(!view) return;
  view.controller.abort(); view.dialog.close(); view.dialog.remove(); S.sniScan=null;
  if(view.focus?.isConnected) view.focus.focus();
}

function openSniScanner(serverId,targetId) {
  closeSniScanner();
  const target=$(targetId); if(!target) return;
  const dialog=document.createElement('dialog'); dialog.id='sniScanner'; dialog.className='sni-dialog';
  const view={dialog,target,focus:document.activeElement,controller:new AbortController(),results:[],running:false};
  S.sniScan=view;
  dialog.innerHTML=`<div class="sni-dialog-head"><div><h3>${uiIcon('gauge')}SNI 延迟扫描</h3><p class="hint">先检测 TLS，再用隔离内核完成两次 Reality 实测。失败目标默认隐藏，不使用生产节点或计费端口。</p></div><button type="button" class="btn" id="sniClose" aria-label="关闭 SNI 扫描">${uiIcon('x')}</button></div><div class="sni-dialog-body"><details><summary>自定义扫描列表 · 内置 ${sniCandidates().length} 个候选</summary><label for="sniScanList">每行一个域名，最多 200 个</label><textarea id="sniScanList" rows="5">${esc(sniCandidates().join('\n'))}</textarea></details><div class="panel-head"><span id="sniProgress" role="status" aria-live="polite">准备扫描</span><button class="btn" type="button" id="sniRescan">${uiIcon('refresh-cw')}重新扫描</button></div><progress id="sniScanProgress" max="100" value="0" aria-label="扫描进度"></progress><div class="sni-results" id="sniScanResults"></div></div><div class="sni-dialog-foot"><span class="hint">仅 Reality 实测通过的目标可选；结果不保证所有客户端和未来网络状态。关闭窗口即停止后续批次。</span><button class="btn" type="button" id="sniCancel">取消</button></div>`;
  document.body.append(dialog); dialog.showModal();
  dialog.addEventListener('cancel',event=>{event.preventDefault();closeSniScanner();});
  $('sniClose').onclick=$('sniCancel').onclick=closeSniScanner;
  const valid=()=>S.sniScan===view && target.isConnected && dialog.open;
  const render=()=>{
    const sorted=[...view.results].sort((a,b)=>(a.latencyMs??Infinity)-(b.latencyMs??Infinity));
    const usable=sorted.filter(r=>r.ok && r.realityVerified), failed=sorted.filter(r=>!r.ok || !r.realityVerified);
    const row=r=>`<div class="sni-result"><div><strong>${esc(r.domain)}</strong><small>${r.ok && r.realityVerified ? esc(r.tls)+' · Reality 双次实测通过'+(r.cached?' · 缓存':'') : esc(r.error || '未通过实际 Reality 验证')}</small></div><span class="${r.ok && r.realityVerified?'sni-latency':'hint'}">${r.ok && r.realityVerified?esc(r.latencyMs)+' ms':'不可选'}</span><button type="button" class="btn small" data-sni-domain="${esc(r.domain)}" data-sni-address="${esc(r.verifiedAddress || '')}" ${r.ok && r.realityVerified?'':'disabled'}>选择</button></div>`;
    $('sniScanResults').innerHTML=usable.map(row).join('')+(failed.length?`<details class="sni-failures"><summary>已隐藏 ${failed.length} 个未通过验证的目标 · 查看原因</summary>${failed.map(row).join('')}</details>`:'');
    dialog.querySelectorAll('[data-sni-domain]').forEach(button=>button.onclick=()=>{
      if(valid()) {target.value=button.dataset.sniDomain;target.dataset.sniVerified=button.dataset.sniDomain;target.dataset.sniAddress=button.dataset.sniAddress;target.dispatchEvent(new Event('input',{bubbles:true}));closeSniScanner();}
    });
  };
  const scan=async(force=false)=>{
    if(view.running || !valid()) return;
    const candidates=[...new Set($('sniScanList').value.split(/\s+/).filter(Boolean))];
    if(!candidates.length || candidates.length>200) { $('sniProgress').textContent='请填写 1–200 个候选域名'; return; }
    view.running=true;view.results=[];view.errors=[];render();$('sniRescan').disabled=true;
    const queue=[];for(let i=0;i<candidates.length;i+=14)queue.push(candidates.slice(i,i+14));
    let completed=0;
    const progress=()=>{$('sniProgress').textContent=`已测试 ${completed} / ${candidates.length} · Reality 可用 ${view.results.filter(r=>r.ok && r.realityVerified).length}${view.errors.length?' · '+view.errors.join('；'):''}`;$('sniScanProgress').value=completed/candidates.length*100;};
    progress();
    await Promise.all(Array.from({length:Math.min(2,queue.length)},async()=>{
      while(queue.length && valid()) {
        const batch=queue.shift();
        try {const data=await api('/servers/sni',{...jsonOpt('POST',{serverId,candidates:batch,force}),signal:view.controller.signal});if(!valid())return;view.results.push(...data.results);}
        catch(error){if(!valid())return;view.errors.push(error.message);}
        completed+=batch.length;if(valid()){progress();render();}
      }
    }));
    view.running=false;if(valid())$('sniRescan').disabled=false;
  };
  $('sniRescan').onclick=()=>scan(true);void scan();
}
